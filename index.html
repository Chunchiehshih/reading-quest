<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>閱讀闖關站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;700&display=swap">

<body>

      <span class="brand-name">閱讀闖關站</span>

    <button class="who" data-action="nav" data-view="profile" id="whoChip">選擇學生</button>
  </div>

<main id="app" class="shell"></main>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="config.js"></script>
<script src="vendor/qrcode.js"></script>
