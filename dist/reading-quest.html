<title>閱讀闖關站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;700&display=swap">
<style>
/* Layout: a manuscript-paper (稿紙) workbook. Pale grid ground, kai-style display type,
   serif reading text, vermilion seals for badges, one jade accent for actions. */
:root {
  --paper: #f2f5f0;
  --sheet: #fbfcf9;
  --ink: #1d2721;
  --ink-soft: #55625a;
  --rule: #cfdcd1;
  --rule-strong: #a9bfae;
  --accent: #2c7656;
  --accent-ink: #ffffff;
  --accent-soft: #dcebe2;
  --seal: #c23b26;
  --seal-soft: #f6dfd9;
  --mark: #fde68a;
  --mark-ink: #1d2721;
  --evidence: #fff3c4;
  --good: #23784a;
  --good-soft: #dff1e6;
  --bad: #b3361f;
  --bad-soft: #f8e1dc;
  --l1: #2e6fab;
  --l2: #2c7656;
  --l3: #a8670f;
  --l4: #7a4e9e;
  --shadow: 0 1px 0 rgba(29, 39, 33, .06), 0 6px 18px -10px rgba(29, 39, 33, .25);
  --f-display: "LXGW WenKai TC", "Kaiti TC", "DFKai-SB", "BiauKai", serif;
  --f-read: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --f-ui: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #131915; --sheet: #1a211c; --ink: #e5ece6; --ink-soft: #9eada3;
    --rule: #2b3730; --rule-strong: #3d4c42; --accent: #5fbf8f; --accent-ink: #0d1510;
    --accent-soft: #1f3529; --seal: #f0715a; --seal-soft: #3a211b; --mark: #6b5a17; --mark-ink: #fff7d6;
    --evidence: #3b3416; --good: #6fd29b; --good-soft: #183323; --bad: #ff8f78; --bad-soft: #3b1e18;
    --l1: #7fb3e6; --l2: #5fbf8f; --l3: #e0a64a; --l4: #b995dc;
    --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 8px 20px -12px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #131915; --sheet: #1a211c; --ink: #e5ece6; --ink-soft: #9eada3;
  --rule: #2b3730; --rule-strong: #3d4c42; --accent: #5fbf8f; --accent-ink: #0d1510;
  --accent-soft: #1f3529; --seal: #f0715a; --seal-soft: #3a211b; --mark: #6b5a17; --mark-ink: #fff7d6;
  --evidence: #3b3416; --good: #6fd29b; --good-soft: #183323; --bad: #ff8f78; --bad-soft: #3b1e18;
  --l1: #7fb3e6; --l2: #5fbf8f; --l3: #e0a64a; --l4: #b995dc;
  --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 8px 20px -12px rgba(0, 0, 0, .7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--f-ui); font-size: 15px; line-height: 1.6;
  background-image:
    linear-gradient(var(--rule) 1px, transparent 1px),
    linear-gradient(90deg, var(--rule) 1px, transparent 1px);
  background-size: 28px 28px; background-attachment: fixed;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; text-wrap: balance; line-height: 1.3; margin: 0; }
h1 { font-size: 1.9rem; }
h2 { font-size: 1.45rem; }
h3 { font-size: 1.15rem; }
p { margin: 0; }
.muted { color: var(--ink-soft); }
.small { font-size: .86rem; }
.tnum { font-variant-numeric: tabular-nums; }

/* top bar */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--sheet); border-bottom: 2px solid var(--ink);
}
.topbar-inner {
  max-width: 1180px; margin: 0 auto; padding: 8px 16px;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; }
.brand-seal {
  width: 36px; height: 36px; display: grid; place-items: center;
  background: var(--seal); color: #fff; font-family: var(--f-display); font-size: 1.3rem;
  border-radius: 6px; transform: rotate(-4deg);
}
.brand-name { font-family: var(--f-display); font-size: 1.3rem; font-weight: 700; letter-spacing: .06em; }
.mainnav { display: flex; gap: 2px; flex-wrap: wrap; margin-left: auto; }
.mainnav button {
  background: none; border: 0; padding: 6px 12px; border-radius: 6px; font-weight: 500; color: var(--ink-soft);
}
.mainnav button[aria-current="page"] { color: var(--ink); background: var(--accent-soft); }
.mainnav button:hover { color: var(--ink); }
.who {
  border: 1.5px solid var(--ink); background: var(--sheet); border-radius: 999px; padding: 4px 14px;
  font-weight: 500; white-space: nowrap;
}
@media (max-width: 640px) {
  .mainnav { order: 3; width: 100%; margin-left: 0; justify-content: space-between; }
  .mainnav button { padding: 6px 8px; }
  .who { margin-left: auto; }
}

.shell { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 64px; }
.sheet {
  background: var(--sheet); border: 1.5px solid var(--rule-strong); border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.spread { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1.5px solid var(--ink); background: var(--sheet); color: var(--ink);
  border-radius: 8px; padding: 8px 16px; font-weight: 500; min-height: 40px;
}
.btn:hover { background: var(--accent-soft); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.small { min-height: 32px; padding: 4px 10px; font-size: .88rem; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.seg { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--sheet); padding: 6px 14px; font-weight: 500; }
.seg button + button { border-left: 1.5px solid var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }

.chip {
  display: inline-flex; align-items: center; gap: 4px; font-size: .8rem; font-weight: 500;
  padding: 1px 8px; border-radius: 999px; border: 1px solid var(--rule-strong); color: var(--ink-soft);
  background: var(--sheet); white-space: nowrap;
}
.lv { --c: var(--l1); }
.lv-1 { --c: var(--l1); } .lv-2 { --c: var(--l2); } .lv-3 { --c: var(--l3); } .lv-4 { --c: var(--l4); }
.chip.lv { color: var(--c); border-color: var(--c); }

.eyebrow { font-size: .78rem; letter-spacing: .14em; color: var(--ink-soft); font-weight: 500; }

/* seals (badges) */
.seal {
  --c: var(--seal);
  width: 54px; height: 54px; border-radius: 50%; display: inline-grid; place-items: center;
  border: 2.5px solid var(--c); color: var(--c); font-family: var(--f-display); font-weight: 700;
  font-size: .95rem; line-height: 1.05; text-align: center; transform: rotate(-8deg);
  background: transparent; flex: none;
}
.seal.off { --c: var(--rule-strong); transform: none; }
.seal.sq { border-radius: 8px; }
.seal-row { display: flex; gap: 10px; flex-wrap: wrap; }

/* map */
.hero {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; align-items: end;
  padding: 24px; margin-bottom: 20px;
}
.hero h1 { font-size: clamp(1.6rem, 4vw, 2.3rem); }
.hero p { max-width: 60ch; margin-top: 8px; color: var(--ink-soft); }
@media (max-width: 720px) { .hero { grid-template-columns: 1fr; } }
.map-path { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(270px, 100%), 1fr)); gap: 16px; }
.quest-card {
  position: relative; padding: 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0;
}
.quest-card .num {
  font-family: var(--f-display); font-size: .9rem; color: var(--ink-soft);
}
.quest-card h3 { font-size: 1.3rem; }
.quest-card .meta { display: flex; gap: 6px; flex-wrap: wrap; }
.quest-card .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: auto; }
.quest-card .stamp {
  position: absolute; top: 12px; right: 14px;
}
.progress-bar { height: 8px; border-radius: 99px; background: var(--rule); overflow: hidden; }
.progress-bar > span { display: block; height: 100%; background: var(--accent); }
.quest-card.waiting { background: transparent; border-style: dashed; box-shadow: none; }
.empty { padding: 28px; text-align: center; color: var(--ink-soft); }

/* library */
.lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(230px, 100%), 1fr)); gap: 12px; }
.lib-item { padding: 14px; text-align: left; background: var(--sheet); border: 1.5px solid var(--rule-strong); border-radius: var(--radius); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.lib-item:hover { border-color: var(--ink); }
.lib-item b { font-family: var(--f-display); font-size: 1.08rem; }

/* quest */
.quest-head { padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
.steps { display: flex; gap: 4px; flex-wrap: wrap; list-style: none; padding: 0; margin: 0; counter-reset: s; }
.steps li {
  counter-increment: s; font-size: .82rem; padding: 3px 10px 3px 6px; border-radius: 999px;
  color: var(--ink-soft); border: 1px solid var(--rule); display: flex; gap: 6px; align-items: center; background: var(--sheet);
}
.steps li::before {
  content: counter(s); width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center;
  background: var(--rule); color: var(--ink); font-size: .72rem; font-weight: 700;
}
.steps li.done { color: var(--ink); }
.steps li.done::before { background: var(--accent); color: var(--accent-ink); content: "✓"; }
.steps li.now { color: var(--ink); border-color: var(--ink); font-weight: 700; }
.steps li.now::before { background: var(--ink); color: var(--sheet); }

.workspace { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; align-items: start; }
.workspace.split { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); }
@media (max-width: 900px) { .workspace.split { grid-template-columns: minmax(0, 1fr); } }
.text-pane { padding: 0; min-width: 0; }
.workspace.split .text-pane { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); max-height: calc(100vh - 96px); overflow: auto; }
@media (max-width: 900px) { .workspace.split .text-pane { position: static; max-height: 60vh; } }
.text-tools {
  position: sticky; top: 0; z-index: 2; display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
  padding: 10px 14px; background: var(--sheet); border-bottom: 1px solid var(--rule); border-radius: var(--radius) var(--radius) 0 0;
}
.text-tools .title { font-family: var(--f-display); font-weight: 700; font-size: 1.1rem; margin-right: auto; }
.article {
  padding: 18px 22px 26px; font-family: var(--f-read); font-size: 1.08rem; line-height: 2.05; letter-spacing: .02em;
  max-width: 44em;
}
.article.big { font-size: 1.32rem; line-height: 2.4; }
.article .para { position: relative; margin: 0 0 .9em; padding: 2px 8px; border-radius: 6px; transition: background .3s; }
.article .para.evidence { background: var(--evidence); box-shadow: inset 3px 0 0 var(--l3); }
.article .pnum { font-family: var(--f-ui); color: var(--seal); font-weight: 700; margin-right: .2em; }
.article h4 { font-family: var(--f-display); font-size: 1.12rem; margin: 1.2em 0 .4em; }
.article ul { margin: 0 0 1em; padding-left: 1.2em; font-size: .95em; line-height: 1.8; }
.article .note { font-size: .93em; color: var(--ink-soft); margin-bottom: .8em; }
.article .tbl { overflow-x: auto; margin: .2em 0 1.2em; }
.article table { border-collapse: collapse; font-family: var(--f-ui); font-size: .88em; line-height: 1.5; min-width: 100%; }
.article th, .article td { border: 1px solid var(--rule-strong); padding: 5px 8px; text-align: left; vertical-align: top; }
.article th { background: var(--accent-soft); }
.article mark.pen { background: var(--mark); color: var(--mark-ink); border-radius: 2px; padding: 0 1px; }
.article.pen-on { cursor: text; }
.article.pen-on mark.pen { cursor: pointer; }
.article ruby rt { font-family: var(--f-ui); font-size: .42em; letter-spacing: 0; color: var(--ink-soft); }
.article .say { border: 0; background: none; color: var(--accent); padding: 0 4px; font-size: .8em; vertical-align: middle; }
.locked-block {
  margin: 1em 0; padding: 14px; border: 1.5px dashed var(--rule-strong); border-radius: 8px;
  font-family: var(--f-ui); font-size: .9rem; color: var(--ink-soft);
}

.stage { padding: 22px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.stage .lvl-banner { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.lvl-name { font-family: var(--f-display); font-size: 1.3rem; font-weight: 700; color: var(--c); }
.dots { display: flex; gap: 6px; flex-wrap: wrap; }
.dot {
  width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--rule-strong); background: var(--sheet);
  font-size: .78rem; display: grid; place-items: center; color: var(--ink-soft); padding: 0;
}
.dot.cur { border-color: var(--ink); color: var(--ink); font-weight: 700; }
.dot.ok { background: var(--good); border-color: var(--good); color: var(--sheet); }
.dot.half { background: var(--l3); border-color: var(--l3); color: var(--sheet); }
.dot.no { background: var(--bad); border-color: var(--bad); color: var(--sheet); }
.stem { font-family: var(--f-read); font-size: 1.18rem; line-height: 1.8; font-weight: 700; }
.stem.big { font-size: 1.5rem; }
.opts { display: grid; gap: 10px; }
.opt {
  display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: center; text-align: left;
  padding: 10px 14px; border: 1.5px solid var(--rule-strong); border-radius: 10px; background: var(--sheet);
  font-family: var(--f-read); font-size: 1.05rem; min-height: 52px;
}
.opt:hover:not([disabled]) { border-color: var(--ink); }
.opt .k {
  width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%;
  border: 1.5px solid var(--ink); font-family: var(--f-ui); font-weight: 700; font-size: .9rem;
}
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); text-decoration: line-through; text-decoration-color: var(--bad); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.right .k { background: var(--good); border-color: var(--good); color: var(--sheet); }
.opt[disabled] { cursor: default; }
.opts.big .opt { font-size: 1.35rem; min-height: 68px; }
.coach {
  border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px;
  border: 1.5px solid var(--rule-strong); background: var(--paper);
}
.coach b { font-family: var(--f-display); font-size: 1.02rem; }
.coach.hint { border-color: var(--l3); }
.coach.fb { border-color: var(--l4); }
.coach.reveal { border-color: var(--bad); }
.coach.yes { border-color: var(--good); background: var(--good-soft); }
.coach .ladder { font-size: .78rem; color: var(--ink-soft); letter-spacing: .08em; }
.nav-row { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

.summary-table { width: 100%; border-collapse: collapse; font-size: .92rem; }
.summary-table th, .summary-table td { padding: 8px 10px; border-bottom: 1px solid var(--rule); text-align: left; }
.summary-table th { font-weight: 500; color: var(--ink-soft); font-size: .82rem; }
.tablewrap { overflow-x: auto; }

.choice-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.choice {
  padding: 12px 14px; border: 1.5px solid var(--rule-strong); border-radius: 10px; background: var(--sheet);
  text-align: left; font-family: var(--f-read); font-size: 1.02rem;
}
.choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.face { font-size: 1.3rem; line-height: 1; display: block; margin-bottom: 4px; font-family: var(--f-ui); }

textarea, input[type="text"], select {
  width: 100%; border: 1.5px solid var(--rule-strong); border-radius: 8px; padding: 8px 10px; background: var(--sheet);
}
textarea { min-height: 90px; resize: vertical; }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: .9rem; font-weight: 500; }

/* journey */
.two-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 16px; align-items: start; }
.panel { padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.radar text { font-family: var(--f-ui); fill: var(--ink-soft); font-size: 12px; }
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 80px minmax(0, 1fr) 46px; gap: 10px; align-items: center; font-size: .9rem; }
.bar-track { height: 14px; background: var(--rule); border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--c); }
.stars { display: flex; flex-wrap: wrap; gap: 4px; font-size: 1.4rem; color: var(--l3); }
.stars .off { color: var(--rule-strong); }
.shelf { display: flex; gap: 6px; flex-wrap: wrap; align-items: flex-end; padding-bottom: 6px; border-bottom: 6px solid var(--rule-strong); min-height: 110px; }
.book {
  writing-mode: vertical-rl; font-family: var(--f-display); font-size: .95rem; padding: 10px 6px; border-radius: 3px 3px 0 0;
  background: var(--c); color: var(--sheet); height: 100px; max-height: 100px; overflow: hidden;
}
.sticker {
  width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display);
  font-size: 1.5rem; background: var(--accent-soft); color: var(--accent); border: 2px dashed var(--accent);
}
.sticker.off { background: transparent; color: var(--rule-strong); border-color: var(--rule-strong); }
.wrong-item { padding: 10px 0; border-bottom: 1px solid var(--rule); display: flex; flex-direction: column; gap: 4px; }
.wrong-item:last-child { border-bottom: 0; }

/* teacher */
.teacher-q { padding: 14px 0; border-bottom: 1px solid var(--rule); display: flex; flex-direction: column; gap: 6px; }
.teacher-q dl { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 4px 10px; margin: 0; font-size: .9rem; }
.teacher-q dt { color: var(--ink-soft); }
.teacher-q dd { margin: 0; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 2px solid var(--ink); }
.tabs button { border: 0; background: none; padding: 8px 14px; font-weight: 500; color: var(--ink-soft); border-radius: 6px 6px 0 0; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--sheet); }
.callout { padding: 12px 14px; border-left: 4px solid var(--l3); background: var(--sheet); border-radius: 0 8px 8px 0; font-size: .9rem; }
pre.json { max-height: 260px; overflow: auto; background: var(--paper); padding: 10px; border-radius: 8px; font-size: .78rem; border: 1px solid var(--rule); }

.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--sheet); padding: 10px 18px; border-radius: 8px; z-index: 50; max-width: calc(100% - 32px);
}
@media (prefers-reduced-motion: no-preference) {
  .pop { animation: pop .35s ease-out; }
  @keyframes pop { from { transform: scale(.9) rotate(-8deg); opacity: .2; } to { transform: rotate(-8deg); opacity: 1; } }
}

/* online class */
.class-head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 640px) { .class-head { grid-template-columns: minmax(0, 1fr); } }
.qr { width: 200px; max-width: 100%; background: #ffffff; padding: 8px; border-radius: 8px; border: 1.5px solid var(--rule-strong); }
.qr svg { display: block; width: 100%; height: auto; }
.qr svg rect[fill="#ffffff"], .qr svg path { shape-rendering: crispEdges; }
.qr.big { width: min(64vh, 82vw); margin: 0 auto; }
.link-box { display: block; padding: 8px 10px; background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; font-size: .8rem; overflow-wrap: anywhere; }
.qr-overlay { position: fixed; inset: 0; z-index: 60; background: var(--paper); display: grid; place-items: center; padding: 16px; cursor: pointer; }
.qr-sheet { text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.qr-sheet h1 { font-size: clamp(1.6rem, 4vw, 2.6rem); }

   * @param typeNumber 1 to 40

    var PAD1 = 0x11;

    var _modules = null;
    var _moduleCount = 0;

    var _dataList = [];

      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);

          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )

              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {

        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);

        for (var i = 0; i < ecdata[r].length; i += 1) {

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }

      return data;

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;

      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +

      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {

      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);

          if (typeof b == 'number') {

              bytes.push(b);
