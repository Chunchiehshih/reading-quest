<script>
window.RLQ_DATA = {"texts": [{"id": "l01", "grade_band": "low", "title": "低年級一〈誰最棒〉", "structure_note": null, "student_text_markdown": "① 午餐吃完的時候，有幾個小朋友坐在一起聊天，老師走過來問他們：「誰最棒？」\n\n② 小安指著小青說：「她最棒，她會彈鋼琴。」\n\n③ 小美指著小杰說：「他最棒，他會說故事。」\n\n④ 小宇指著小芬說：「她最棒，她跳繩跳得最快。」\n\n⑤ 阿明低著頭說：「我什麼都不會，一點兒也不棒。」\n\n⑥ 老師摸摸阿明的頭說：「怎麼會呢？今天早上升旗的時候，你幫小雯撿起被風吹走的帽子，你很棒呀！」\n\n⑦ 上課了，老師拍拍手，對全班小朋友說：「大家都很棒。老師前天去小可家拜訪，奶奶告訴我，小可每天都會幫忙澆花，也很棒！」", "paragraph_count": 7, "teacher_notes": ["說話的小朋友有四位（小安、小美、小宇、阿明）；會彈鋼琴的是小青，跳繩最快的是小芬，幫助同學的是阿明。事件先後：前天老師去小可家 → 今天早上阿明幫小雯撿帽子 → 午餐後阿明低著頭。"]}, {"id": "l02", "grade_band": "low", "title": "低年級二〈公分？尺？〉", "structure_note": null, "student_text_markdown": "① 在陽光國小的一個二年級教室裡，下課時，有一群學生在聊天。\n\n② 周子豪問：「你們知道，什麼是公分嗎？」\n\n③ 林小毅說：「你可以看尺啊！我媽媽說尺上寫著數字的一大格，就是一公分。」\n\n④ 陳品妤驚訝的問：「尺上有格子？」\n\n⑤ 林小毅說：「對呀！有長長直直的直尺，有三個角的三角板，還有可以拉很長的捲尺。大部分的人家裡都有直尺，有些人家裡還有捲尺，三角板比較少見。剛好這三種我家都有。」\n\n⑥ 王心怡說：「林小毅，你懂得真多，好厲害！」\n\n⑦ 陳品妤又問：「林小毅，我家量東西的工具為什麼沒有格子，一按下去就射出一點紅光，然後跳出數字呢？」\n\n⑧ 林小毅回答：「那個叫做雷射測距儀，我家也有。」\n\n⑨ 「林小毅，你家量東西的工具好多呀！」大家發出羨慕的聲音。\n\n⑩ 周子豪想了一下，繼續問：「林小毅，我還是不懂什麼是公分？」\n\n⑪ 林小毅想了想，拿起一枝鉛筆和一塊橡皮擦問大家：「大家覺得鉛筆比較長，還是橡皮擦比較長？」\n\n⑫ 「鉛筆比較長。」大家異口同聲的說。\n\n⑬ 林小毅繼續說：「對，因為這枝鉛筆有十八公分，橡皮擦只有四公分。十八公分比四公分長，所以大家會覺得鉛筆比較長。」", "paragraph_count": 13, "teacher_notes": ["對尺了解最多的是林小毅；家裡只有雷射測距儀的是陳品妤；公分用來量「長度」；林小毅家至少有四種量長度的工具（直尺、三角板、捲尺、雷射測距儀）。生活估計題可問：國語課本的寬度大約是幾公分？（十八公分的鉛筆比課本短一點，約二十公分合理；二公分、二百公分、兩千公分不合理。）"]}, {"id": "l03", "grade_band": "low", "title": "低年級三〈黃雨鞋〉", "structure_note": null, "student_text_markdown": "① 梅雨季來了，今天一早就下起大雨。小兔穿上他最喜歡的白色球鞋，可是兔媽媽擔心他的腳會淋濕，硬是要他換上一雙黃雨鞋。\n\n② 「好醜哦！」小兔不開心的說。\n\n③ 「怎麼會？這是你哥哥以前穿過的。」兔媽媽摸摸小兔的長耳朵。\n\n④ 滴答──滴答──\n\n⑤ 「你聽，外面的雨好大，腳不淋濕比較重要。快去上學吧！」\n\n⑥ 小兔慢吞吞的走進森林小學。\n\n⑦ 「小兔早！」松鼠從樹洞裡探出頭，笑著看著他。\n\n⑧ 「小兔好！」刺蝟一邊收起雨傘，一邊笑著問好。\n\n⑨ 「小兔你好，今天的雨好大啊！」烏龜慢慢的從殼裡伸出頭來，滿臉都是雨水呢！\n\n⑩ 「小兔，我今天想要跟你坐在一起。」小狗拉起小兔的手，低頭看了看說：「你這雙雨鞋好漂亮啊！」\n\n⑪ 「你不要笑我。」小兔低聲的說。\n\n⑫ 「我沒有笑你，真的很漂亮。」\n\n⑬ 「少來，你跟他們都一樣。」\n\n⑭ 「他們？」小狗覺得奇怪。\n\n⑮ 「松鼠、刺蝟和烏龜，他們都笑我。」\n\n⑯ 「有嗎？」\n\n⑰ 「有。」小兔認真的點點頭。\n\n⑱ 「可是我沒聽見他們在笑你呀！」\n\n⑲ 「他們在心裡偷笑。」\n\n⑳ 「他們都是好同學，不會笑你的。他們為什麼要笑你呢？」\n\n㉑ 「因為我穿了一雙很醜的黃雨鞋。」\n\n㉒ 「小兔，你誤會了，他們不是笑你的雨鞋。黃雨鞋真的不醜，而且大家一早看到你，當然要向你微笑、打招呼哇！」\n\n㉓ 「是這樣嗎？黃雨鞋真的不醜？沒有人笑我？」小兔的眼睛瞪得大大的。\n\n㉔ 小狗很用力、很用力的點點頭。\n\n㉕ 「我告訴你，這雙雨鞋是我哥哥以前穿的，其實早上媽媽拿給我的時候，我就覺得它亮亮的，像兩條小香蕉……」小兔興奮的說著。\n\n㉖ 雨還是下得很大。\n\n㉗ 小兔牽著小狗的手走進教室，心裡一下子晴朗了起來。", "paragraph_count": 27, "teacher_notes": ["「滴答──滴答──」是雨聲；小兔以為大家笑他，是因為覺得自己的雨鞋不好看；媽媽擔心的是小兔的腳會淋濕；在學校向小兔打招呼的同學有四位（松鼠、刺蝟、烏龜、小狗）。最後一句「心裡一下子晴朗了起來」與「雨還是下得很大」形成對比，可用於層次四。"]}, {"id": "l04", "grade_band": "low", "title": "低年級四〈買文具〉", "structure_note": null, "student_text_markdown": "① 山羊阿美的文具店開張了，狐狸媽媽娜娜是她的好朋友，特別帶著阿福、圓圓、皮皮和樂樂四個孩子去捧場。她告訴孩子們，每人可以選三樣文具。\n\n② 狐狸一家人看著架子上各式各樣的文具，真是心動，輪到他們結帳時，櫃臺上堆滿了他們挑選的東西。除了狐狸媽媽自己選的一本筆記本，另外還有一盒彩色筆、一個筆袋、一個水壺、一塊橡皮擦、一枝鉛筆、一張貼紙、一瓶膠水、一把尺、一本便條紙、一把剪刀、一包色紙和一盒蠟筆。\n\n③ 他們一回到家，狐狸爸爸大寶看到大家買了這麼多東西，驚訝的問：「你們買了什麼呀？」阿福和圓圓就拿出袋子裡的文具向爸爸說明。\n\n④ 「彩色筆一盒九十元，筆袋一個一百二十元，水壺一個一百五十元，最貴的這三樣是我選的。」阿福一臉滿足的說。\n\n⑤ 「貼紙一張十五元，橡皮擦一塊十元，鉛筆一枝八元，我挑的這三樣最便宜。」圓圓說。\n\n⑥ 在圓圓旁邊的皮皮接著說：「膠水、尺和便條紙，這三樣是我選的，也是爸爸上班常用的文具。」", "paragraph_count": 6, "teacher_notes": ["狐狸媽媽娜娜是山羊阿美的好朋友；狐狸爸爸大寶沒有去文具店；一共買了十三樣（媽媽一樣、四個孩子各三樣）；用刪去法可知剪刀、色紙、蠟筆是樂樂選的；皮皮選的尺，價錢一定比十五元貴、比九十元便宜，所以「四十元」合理，「五元」「一百元」「一百三十元」不合理。"]}, {"id": "l05", "grade_band": "low", "title": "低年級五〈果汁口味調查〉", "structure_note": null, "student_text_markdown": "① 下星期六是松鼠波波搬進新樹洞的日子，他邀請好朋友一起來新家野餐。為了讓大家都能喝到自己喜歡的果汁，波波先寄給朋友「果汁口味調查」的信，再請他們填好後寄回來。\n\n② 他總共寄了十二張，最後只收到九張回信。\n\n| 回信 | 回信 |\n| --- | --- |\n| 我是兔子妮妮，我選「蘋果」口味。 | 我是小狗旺旺，我選「柳橙」口味。 |\n| 我是鹿兒小花，我選「蘋果」口味。 | 我是小羊細細，我選「蘋果」口味。 |\n| 我是小豬嘟嘟，我選「柳橙」口味。 | 我是小雞嘉嘉，我選「西瓜」口味。 |\n| 我是小鴨達達，我選「芭樂」口味。 | 我是小貓咪咪，我選「蘋果」口味。 |\n| 我是小牛黑黑，我選「芭樂」口味。 |  |\n\n③ 等了幾天，猴子跳跳、小馬飛飛和黑熊壯壯還是沒有回信，波波就打電話給他們。結果，跳跳要西瓜口味，飛飛喜歡奇異果口味，而壯壯那天要去外婆家，不能參加。\n\n④ 統計好大家喜歡的果汁口味後，波波就開始打掃新家的樹洞了。", "paragraph_count": 4, "teacher_notes": ["最多人選蘋果（妮妮、小花、細細、咪咪，共四位）；與旺旺選同口味的是嘟嘟；如果波波自己喜歡葡萄口味，野餐當天依結果準備十二杯（九張回信、兩通電話、加上自己），共有六種口味（蘋果、柳橙、西瓜、芭樂、奇異果、葡萄）。事件先後：寄調查信 → 收到回信 → 打電話問跳跳 → 打掃樹洞 → 搬家野餐。"]}, {"id": "l06", "grade_band": "low", "title": "低年級六〈有沒有帶水壺〉", "structure_note": null, "student_text_markdown": "**表一　今天全班帶水壺調查**\n\n| 水壺人：白開水水壺人 | 水壺人：飲料水壺人 | 口渴人：忘記帶口渴人 | 口渴人：沒有水壺口渴人 |\n| --- | --- | --- | --- |\n| 阿哲、小婷、宇軒、心儀 | 子傑、怡君、家豪 | 品廷、宇彤 | 波波、小米 |\n\n**表二**\n\n| 超級厲害白開水飲料雙壺人 |\n| --- |\n| 林小晴 |\n\n① 放學一回到家，林小晴拿出一張表（表一）。\n\n② 「這是什麼？」媽媽問。\n\n③ 「今天吳老師調查全班有沒有帶水壺，我把調查結果記下來了。」\n\n④ 「吳老師是不是說有帶的人叫『水壺人』，沒有帶的人叫『口渴人』？」林子安說。\n\n⑤ 「子安，你怎麼知道呢？」爸爸問。\n\n⑥ 「你們忘了嗎？兩年前我讀一年級時，也是吳老師教的。小晴，吳老師是不是還跟你們說：她讀小學一年級時，有一次運動會忘了帶水，結果在操場上中暑了。」\n\n⑦ 「對呀！跟爸爸一樣，常常忘東忘西。」小晴笑著說。\n\n⑧ 「哪有？」子安馬上反問。\n\n⑨ 「媽媽說過，以前我們每次出去玩，全家四個人，家裡唯一的男生最常忘記帶東西。」\n\n⑩ 子安說：「哪有每次？爸爸只有一次忘了帶車鑰匙，讓大家等他一下。」\n\n⑪ 「唉呀！我都忘了呢！」爸爸笑著說。\n\n⑫ 「你的水壺人還分組哇？」媽媽問。\n\n⑬ 「對呀！水壺裡裝白開水的，叫做『白開水水壺人』。裝飲料的，叫做『飲料水壺人』。口渴人也有分組！家裡有水壺，可是忘了帶的人，叫做『忘記帶口渴人』。根本沒有水壺的人，叫做『沒有水壺口渴人』。」小晴指著表格，像講解員一樣。\n\n⑭ 「一、二、三、四……」爸爸拿起表，數著人數，「小晴，人數不對呀！」\n\n⑮ 「你看！」小晴拿出第二張表（表二），「還有一組叫做『超級厲害白開水飲料雙壺人』。」\n\n⑯ 「什麼？」爸爸、媽媽和子安一起問。\n\n⑰ 「哈哈！因為我們家是開豆漿店的呀！我一個水壺裝白開水，一個水壺裝豆漿。」", "paragraph_count": 17, "teacher_notes": ["家裡只有爸爸一個男生，所以子安是女生；子安兩年前就讀一年級，比小晴大，小晴要叫她「姊姊」。全班人數：表一十一人加上表二的小晴，共十二人。事件先後：吳老師小時候中暑 → 子安讀一年級 → 小晴記下調查結果 → 爸爸數人數。「沒有水壺口渴人」最需要老師關心，可用於評估題。"]}, {"id": "l07", "grade_band": "low", "title": "低年級七〈防曬用品統計〉", "structure_note": null, "student_text_markdown": "**紅豆幼兒園　戶外課帶防曬用品統計表**\n\n班級：草莓班　　統計時間：05.16\n\n| 座號 | 性別 | 學生姓名 | 未帶防曬用品 | 帽子 | 陽傘 | 顏色 |\n| --- | --- | --- | --- | --- | --- | --- |\n| 1 | 男 | 狗汪汪 |  | ✔ |  | 藍 |\n| 2 | 男 | 貓喵喵 |  |  | ✔ | 黃 |\n| 3 | 男 | 豬嚕嚕 |  | ✔ |  | 藍 |\n| 4 | 男 | 熊大大 | ✔ |  |  |  |\n| 5 | 男 | 鴨呱呱 | ✔ |  |  |  |\n| 6 | 男 | 象鼻鼻 |  |  |  |  |\n| 7 | 男 | 獅吼吼 |  |  | ✔ | 黃 |\n| 8 | 男 | 虎小小 |  | ✔ |  | 綠 |\n| 9 | 男 | 蛇溜溜 | ✔ |  |  |  |\n| 10 | 女 | 兔跳跳 |  | ✔ |  | 藍 |\n| 11 | 女 | 鹿角角 |  |  | ✔ | 黃 |\n| 12 | 女 | 蛙咕咕 |  |  | ✔ | 綠 |\n| 13 | 女 | 羊咩咩 | ✔ |  |  |  |\n| 14 | 女 | 鵝白白 |  | ✔ |  | 藍 |\n| 15 | 女 | 蝶飛飛 |  | ✔ |  | 粉紅 |", "paragraph_count": null, "teacher_notes": ["6 號象鼻鼻整列沒有填，是統計當天沒到學校的人。顏色最多的是藍色（四個）；數量最多的是藍色帽子（四頂），其次是黃色陽傘（三把）。和蛙咕咕同顏色但不同種類的男生是虎小小（綠色帽子）；和狗汪汪同種類但不同顏色的女生是蝶飛飛（粉紅色帽子）。全班十五人，到校十四人，未帶防曬用品四人。"]}, {"id": "l08", "grade_band": "low", "title": "低年級八〈校外教學點餐〉", "structure_note": null, "student_text_markdown": "① 今天一早，導師林雅婷老師一進教室，就在黑板上畫了一條大大的鯨魚。\n\n② 許小宇一看到便舉手說：「我知道，我們要去看海裡的動物！」\n\n③ 林雅婷老師面帶微笑的向大家說：「下星期五要舉辦二年級的校外教學，我們要參觀海生館，中午會在館內的麵館用餐。」\n\n④ 張小風興奮的說：「我知道海生館這個地方。我有三個舅舅，大舅住在臺南，二舅住在屏東，三舅住在臺東，我每次去二舅家，他都會帶我去那裡玩。」\n\n⑤ 王嘉恩說：「我也去過，是我讀幼兒園中班的時候。」\n\n⑥ 趁著學生講話時，林老師在黑板上畫了四個小圖案：一頭牛、一隻雞、一條魚和一片青菜，然後說：「當天每個人的午餐是一碗麵、一份燙青菜和一杯紅茶。麵館的麵有四種口味：牛肉、雞絲、海鮮和素食。現在，老師把調查表傳下去，大家先勾選自己想吃的口味，再請班長做最後的統計。」\n\n⑦ 下課時，吳美琳拿到調查表，看了好久，好奇的問旁邊的同學：「陳若希，你覺得哪一種口味比較好吃？」\n\n⑧ 「我也在猶豫呢！因為我已經半年沒吃過牛肉麵了。」\n\n⑨ 「好吧！那我就選這個。」吳美琳填完後迅速傳給下一位同學。\n\n⑩ 放學前，班長算好了，向老師報告：「老師，我算好了，總共是牛肉口味五碗、雞絲口味八碗、海鮮口味三碗和素食口味六碗。您要吃哪一種呢？調查表上也要登記導師的份數。」\n\n⑪ 林老師說：「我選最多人吃的那個口味好了，謝謝你。」", "paragraph_count": 11, "teacher_notes": ["全班學生共二十二位（五＋八＋三＋六）；最少的是海鮮口味；林老師的午餐是一碗雞絲麵、一份燙青菜和一杯紅茶。從張小風說「每次去二舅家他都帶我去」，配合二舅住在屏東，可推出用餐地點在屏東。最早發生的事是王嘉恩讀幼兒園中班時去海生館。"]}, {"id": "m01", "grade_band": "middle", "title": "中年級一〈圖書禮券〉", "structure_note": null, "student_text_markdown": "**圖一　禮券**：「好書禮券　壹佰元　你很棒，請繼續加油！」\n\n**圖二　學校附近的書店**\n\n| 書店 | 位置 | 離光明街多遠 |\n| --- | --- | --- |\n| 書蟲書店 | 光明街上，學校正門對面 | 就在光明街上 |\n| 小樹書店 | 光明街和大山路口 | 走路一分鐘 |\n| 藍天書店 | 大山路上的市場旁 | 走路五分鐘 |\n| 好讀書店 | 河堤路底 | 走路十五分鐘 |\n\n① 「阿姨，我們老師說可以拿這張來買書。」她把圖書禮券（圖一）舉得高高的。\n\n② 「你真棒！你是哪一班的學生啊？」\n\n③ 「三年乙班。」\n\n④ 「三年乙班？陳柏翰是你同學，對不對？他昨天來，買了兩本貼紙書，一本二十八元，兩本五十六元，我再優待他，扣掉六元，總共五十元，剛好用掉他的禮券。」\n\n⑤ 「老闆娘──」其他客人大聲叫著。\n\n⑥ 「妹妹，你先看看，阿姨待會兒再過來。」\n\n⑦ 其實三天前老師就頒獎了，她為了買到更多書，特別把每家書店都先逛過一次，最後決定到這家。雖然這家書店離光明街最遠，但它最便宜。\n\n⑧ 看著滿屋子的書，她的腦海再度響起徐怡文老師的話：「各位同學，我們給林語晴、高宇恩、陳柏翰三位同學一次愛的鼓勵。這次閱讀比賽的獎勵，除了獎狀，還有學校附近四家書店聯合贈送的圖書禮券，分別是兩百元、一百元、五十元。你們三位同學可以直接到這四家書店買書。來，拿好，另外給你們這張書店位置表（圖二）。」\n\n⑨ 她看著架上那本厚厚的恐龍百科，捏捏手中的禮券，不知道夠不夠？真羨慕林語晴，拿到那麼多禮券，一定可以買好幾本恐龍百科。", "paragraph_count": 9, "teacher_notes": ["老師依序唱名林語晴、高宇恩、陳柏翰，金額依序是兩百、一百、五十元，所以林語晴是兩百元。陳柏翰是昨天來買書的同學，主角又羨慕林語晴，所以主角是高宇恩（禮券一百元）。老闆娘叫她「妹妹」，可知主角是女生。主角選的是離光明街最遠的「好讀書店」。主角最想買的是恐龍百科。"]}, {"id": "m02", "grade_band": "middle", "title": "中年級二〈這是哪一科的考卷？〉", "structure_note": null, "student_text_markdown": "**考卷上的題目**\n\n三、先讀一讀短詩，再根據下列圖形表，填入正確答案。\n\n形狀家族真熱鬧，大小顏色排排站，\n\n睜大眼睛仔細看，找到（　　）號笑哈哈。\n\n提示：（　　）號的圖案不是小的，不是圓的，不是空心的，也不是紅色的。\n\n| 號碼 | 大小 | 形狀 | 實心或空心 | 顏色 |\n| --- | --- | --- | --- | --- |\n| 1 | 大 | 圓形 | 實心 | 紅 |\n| 2 | 小 | 圓形 | 空心 | 藍 |\n| 3 | 大 | 正方形 | 實心 | 紅 |\n| 4 | 小 | 正方形 | 空心 | 綠 |\n| 5 | 大 | 三角形 | 空心 | 藍 |\n| 6 | 小 | 三角形 | 實心 | 綠 |\n| 7 | 大 | 圓形 | 空心 | 綠 |\n| 8 | 大 | 正方形 | 空心 | 藍 |\n| 9 | 小 | 星形 | 空心 | 紅 |\n| 10 | 大 | 星形 | 實心 | 紅 |\n| 11 | 小 | 圓形 | 實心 | 藍 |\n| 12 | 大 | 三角形 | 實心 | 藍 |\n\n① 「柏宇，考得怎麼樣？」面對柏宇升上國小後的第一次考試，媽媽緊張的詢問結果。\n\n② 「很好，全部考卷只錯一題。」\n\n③ 「哪一題？」\n\n④ 柏宇將摺好的考卷攤平，指給媽媽看。（見上方題目）\n\n⑤ 「不會吧？這應該是數學的題目吧？老公，你快來看看。」\n\n⑥ 爸爸看完，想了一下說：「這種題目，應該是自然科的吧？」\n\n⑦ 姊姊芸廷在一旁說：「我們學校一年級沒有自然科，柏宇他們一年級只考國語、數學、生活三科。爸爸您說的自然科，是到我三年級才有。」\n\n⑧ 「那這種題目應該出在生活考卷才對啊！怎麼會在這張考卷出現呢？」", "paragraph_count": 8, "teacher_notes": ["符合提示的是 12 號（大、三角形、實心、藍色），可用刪去法：大的→ 1、3、5、7、8、10、12；不是圓的→ 3、5、8、10、12；實心→ 3、10、12；不是紅色→ 12。媽媽說「應該是數學」、爸爸說「應該出在生活」，表示這張不是數學也不是生活考卷，一年級又沒有自然科，所以是國語考卷。「升上國小後的第一次考試」→一年級上學期。三科只錯一題→兩張一百分。姊姊芸廷已上三年級以上，年紀比較大。"]}, {"id": "m03", "grade_band": "middle", "title": "中年級三〈圈叉棋達人〉", "structure_note": null, "student_text_markdown": "① 小宇最愛玩〇✕遊戲，也就是一般人說的圈叉棋，大家都叫他「〇✕達人」。雖然在安親班裡，小宇年紀最小，但他只要一有空檔就找人挑戰。他還自己設計了一本小冊子，把每一次比賽的過程都記錄下來。今天趁著媽媽還沒來接他，他又玩了幾回。\n\n**小宇的比賽紀錄冊（誰猜拳贏就先畫）**\n\n| 回合 | 對手 | 猜拳（小宇／對手） | 先畫的人 | 兩人一共畫了幾步 | 結果 |\n| --- | --- | --- | --- | --- | --- |\n| 第一回 | 美琪 | 石頭／布 | 美琪 | 9 步 | 平手 |\n| 第二回 | 志豪 | 剪刀／布 | 小宇 | 7 步 | 小宇勝 |\n| 第三回 | 佳欣 | 布／剪刀 | 佳欣 | 9 步 | 平手 |\n| 第四回 | 俊傑 | 石頭／剪刀 | 小宇 | 5 步 | 小宇勝 |\n| 第五回 | 品萱 | 布／石頭 | 小宇 | 7 步 | 小宇勝 |\n\n② 當他贏了品萱時，正巧志明老師經過，大家就說要小宇和志明老師玩一場。\n\n③ 志明老師說：「玩圈叉棋，通常先畫的比較有利，所以猜拳的運氣很重要，接下來不管是搶攻還是防守，都要占到好位置，這是一種需要專心和細心的比賽。我已經輸給小宇好幾次了，小宇實在太投入、太專注了。不過老師還有事要先去處理，今天就先不跟小宇玩了。」話一說完就直接離開。\n\n④ 品萱輸了很不甘心，拿起小宇的小冊子認真的研究，「老師，一定要畫〇和✕嗎？畫別的符號不可以嗎？」\n\n⑤ 「老師早就走了啦！」庭瑄笑著對品萱說：「你的觀察力這麼差，難怪會輸。」", "paragraph_count": 5, "teacher_notes": ["年紀最小的是小宇；畫之前要先猜拳；志明老師提到運氣、搶好位置、專心細心，但沒有提到「需要好的符號」。五場中表現最不理想的是俊傑：兩人一共只畫了五步，小宇先畫三步、俊傑只畫了兩步就輸了。小宇被稱為達人的理由：常找人挑戰、很投入專注；還自己設計小冊子記錄比賽過程。"]}, {"id": "m04", "grade_band": "middle", "title": "中年級四〈汪老師的找動物遊戲〉", "structure_note": null, "student_text_markdown": "① 四年丙班汪依帆老師教完一篇文章──「動物園的一天」，突然想起讀小學時玩過的「尋寶遊戲──找動物」，就照著設計，在黑板上寫了二十八個字。\n\n|  |  |  |  |  |  |  |\n| --- | --- | --- | --- | --- | --- | --- |\n| 足 | 獅 | 電 | 老 | 斑 | 冰 | 孔 |\n| 海 | 機 | 子 | 腦 | 虎 | 鵝 | 雀 |\n| 袋 | 球 | 熊 | 車 | 馬 | 箱 | 企 |\n| 手 | 豚 | 書 | 鼠 | 火 | 包 | 貓 |\n\n② 接著請全班學生從中找出動物的名稱，並限時三分鐘完成。全班學生答案總表如下：\n\n| 姓名 | 答案 |\n| --- | --- |\n| 陳安 | 獅子、老虎、足球、斑馬、電腦、孔雀、袋鼠 |\n| 林宇 | 足獅、電老、斑冰、海機、子腦、虎鵝 |\n| 王恩 | 足球、電腦、海豚、火車 |\n| 張晴 | 長頸鹿、大象、河馬、猴子、無尾熊 |\n\n③ 幾天後，自然科任黃美華老師模仿汪依帆老師，也在黑板上寫了一張字表，只是標題還空著：\n\n**尋寶遊戲──找（　　　）**\n\n|  |  |  |  |  |  |  |\n| --- | --- | --- | --- | --- | --- | --- |\n| 籃 | 菠 | 電 | 茄 | 南 | 漢 | 洋 |\n| 球 | 菜 | 視 | 子 | 瓜 | 堡 | 蔥 |\n| 竹 | 咖 | 青 | 米 | 蘿 | 披 | 可 |\n| 筍 | 啡 | 椒 | 玉 | 蔔 | 薩 | 樂 |", "paragraph_count": 3, "teacher_notes": ["汪老師是從「小時候的經驗」學會這個遊戲。答案總表是「全班學生」的，只有四列，所以四年丙班有四位學生。字表裡的動物共八種：獅子、老虎、斑馬、企鵝、袋鼠、海豚、孔雀、熊貓。答對最多的是陳安（五個），王恩答對一個，林宇是橫著兩字一組亂念，張晴寫的動物都不在字表裡。黃老師的標題應填「蔬菜」（菠菜、茄子、南瓜、玉米、青椒、蘿蔔、洋蔥、竹筍）。"]}, {"id": "m05", "grade_band": "middle", "title": "中年級五〈海風市捷運〉", "structure_note": null, "student_text_markdown": "① 「子晴、阿哲，因為公司臨時要開會，姑姑必須加班，你們難得來海風市一趟，卻無法帶你們去玩，真的很不好意思。今天你們姐弟倆自己出門可以嗎？」\n\n② 「姑姑，您別擔心，我之前來海風市參加過好幾次比賽，我們可以自己去玩。」\n\n③ 「你們都有交通卡（註一）嗎？」\n\n④ 「我有，阿哲沒有。」\n\n⑤ 林雅雯從皮夾抽出兩張千元大鈔給子晴，說：「來，這錢帶著。子晴，到巷子口超商幫弟弟買一張交通卡。往右走兩百公尺就是大學站。手機裡有姑姑的電話號碼嗎？」\n\n⑥ 「有。」子晴點點頭。\n\n⑦ 「你們想好去哪裡玩了嗎？」\n\n⑧ 「我們想去燈塔。去年我國三暑假時，參加了海洋科學營，在營隊裡認識了一位同學，她家就在燈塔附近。我已經聯絡她了，她今天要當我們的導遊。」\n\n⑨ 「好，子晴你真的很像你爸爸，謹慎又細心。來，這裡有一張海風市捷運路線表（註二）給你們參考。有任何事就打電話給我。」\n\n⑩ 「姑姑，您不用擔心，我會保護姐姐的。」\n\n⑪ 「好，阿哲乖。晚上姑姑在海味軒餐廳訂位了，搭捷運到博物館站，走三號出口上去就看得到它的招牌，大伯、二伯他們也會來，晚上姑姑再好好跟你們聊一聊。」\n\n註一　交通卡：搭乘捷運時，儲值車資用的卡片。\n\n註二　海風市捷運路線表（虛構）：\n\n| 路線 | 站名（依序） |\n| --- | --- |\n| 紅線 | 港口、魚市、中央、公園、大學、山頂 |\n| 藍線 | 機場、花市、中央、博物館、海灘 |\n| 綠線 | 公園、老街、燈塔、海灘 |\n\n同一個站名出現在兩條路線，就是可以轉乘的站。", "paragraph_count": 11, "teacher_notes": ["路線表上有三條路線。早上從大學站到燈塔，要先搭紅線到公園站，再轉乘綠線（轉乘站：公園）。晚上從燈塔到博物館，最少只要轉一次：綠線到海灘站，再轉乘藍線（轉乘站：海灘）。媽媽不在場，姑姑說「很像你爸爸」，可知孩子們的爸爸是姑姑的兄弟；加上大伯、二伯，林雅雯至少有三位兄弟。姑姑叮嚀子晴幫弟弟買交通卡、給路線表、問有沒有電話，可看出她很細心。"]}, {"id": "m06", "grade_band": "middle", "title": "中年級六〈三樣沒見過的東西〉", "structure_note": null, "student_text_markdown": "**三樣我沒見過的東西（作業單）**\n\n| 序號 | 名稱 | 提供者 | 物品說明 |\n| --- | --- | --- | --- |\n| 1 | 會議紀錄 | 媽媽、李阿姨 | 1. 大人的作業。 2. 開會的時候寫。 3. 上面記著大家決定的事。 |\n| 2 | 血壓計 | 李阿姨 | 1. 綁在手臂上的小機器。 2. 會跳出兩個數字。 3. 醫師交代：每天早上要量一次。 |\n| 3 |  |  |  |\n\n① 李阿姨和媽媽是多年的同事，今天晚上媽媽邀請李阿姨下班後到我們家討論公事，順便吃晚餐。\n\n② 晚餐後，我拿作業請李阿姨幫忙。\n\n③ 李阿姨說：「佳蓉的字好整齊呢！阿姨已經提供兩樣東西，還要一樣啊？」\n\n④ 「我就知道李阿姨一定能幫上忙。」我說。\n\n⑤ 「佳蓉長大了，嘴巴真甜！」李阿姨摸摸我的頭，「還剩一樣，看看阿姨能不能再幫上忙？」她左看看、右瞧瞧，問：「客廳裡的東西都找過了嗎？」\n\n⑥ 「都找過了，每一樣我都見過。」我說。\n\n⑦ 「真的什麼都見過？」李阿姨看起來不太相信。\n\n⑧ 「真的！不相信的話，您問我媽媽。」\n\n⑨ 李阿姨轉頭看看媽媽，媽媽說：「沒錯，佳蓉從小就跟著我先生志偉玩『超市大特價』的遊戲，每天認識各種東西。不要說家裡，連街上店家賣的東西，佳蓉也都清清楚楚。」\n\n⑩ 「佳蓉好厲害呢！這下阿姨麻煩了。讓我想想，還有一樣是什麼呢？」李阿姨站起來，看著自己的提包，「有了！你看看！」她將包包拿起來，輕輕放在桌上。\n\n⑪ 「這個是包包呀！」我疑惑的說。\n\n⑫ 「阿姨當然知道佳蓉認識包包，阿姨指的是裡面的東西。快打開看看，可別小看它，光是小袋子就有好幾個，裡頭可是什麼都有呢！一定有你沒見過的東西。」李阿姨一臉很有把握的樣子。\n\n⑬ 「什麼事這麼開心哪？」這時，爸爸剛好端著切好的西瓜出來。\n\n⑭ 「就包包呀！美玲認為她的包包最厲害了！」媽媽邊吃西瓜邊說。\n\n⑮ 「李阿姨，您的包包和我媽媽的差不多，除了錢包以外，您還有手機、鑰匙、護唇膏、行事曆、原子筆、衛生紙、交通卡、名片夾和兩張OK繃，算起來還比我媽媽少了摺疊傘和保溫杯。這些東西我全都見過哇！還有什麼其他的東西嗎？」", "paragraph_count": 15, "teacher_notes": ["血壓計是李阿姨的（只有她是提供者）；李阿姨稱讚主角「字整齊」「嘴巴甜」「好厲害（認識很多東西）」，沒有讚美她「跑得快」；作業單只完成兩項；有摺疊傘和保溫杯的是媽媽。李阿姨名叫美玲，爸爸名叫志偉，是帶主角玩「超市大特價」遊戲的人。"]}, {"id": "m07", "grade_band": "middle", "title": "中年級七〈臺灣特色大集合〉", "structure_note": null, "student_text_markdown": "**黑板上的五塊題目（從左邊數過來）**\n\n| 位置 | 看起來的樣子 | 寫了什麼 |\n| --- | --- | --- |\n| 最左邊 | 全部由上往下直著寫 | 臺灣國家公園：墾丁、玉山、太魯閣、澎湖南方四島／鵝鑾鼻燈塔、主峰、燕子口、藍洞 |\n| 左邊數來第二塊 | 寫得很整齊，字有點小 | 臺灣歷史事件發生地：鹿耳門、霧社、金門、基隆／鄭成功登陸、霧社事件、八二三砲戰、清法戰爭 |\n| 中間 | 左右兩排擠在一起 | 臺灣地方特有農產品：大湖、麻豆、澎湖、池上／草莓、文旦、絲瓜、稻米 |\n| 右邊數來第二塊 | 左右兩邊已經用線連好了 | 臺灣常見鳥類與在哪裡看得到：藍腹鷴─中海拔森林、黑面琵鷺─臺南七股、玄燕鷗─澎湖貓嶼、栗喉蜂虎─金門 |\n| 最右邊 | 橫著寫 | 臺灣地方特色小吃：臺南、彰化、澎湖、新竹／擔仔麵、肉圓、仙人掌冰、貢丸 |\n\n① 「大家都寫好了，謝謝你們！」看著五位學生走下講臺，鄭老師從教室後方往黑板走。\n\n② 「咦？怎麼都沒寫題號，也沒照順序寫呢？第一題在哪裡？怎麼在黑板的最右邊？橫寫時要由左至右，張宇哲，記住唷！」\n\n③ 「是，老師。」\n\n④ 「第二題呢？黃冠廷，你怎麼連起來了？我是說『把題目抄在黑板上』。」\n\n⑤ 「不是啦！老師，我想這一題很難，全班大概只有我會，我就想說助人為快樂之本哪！」\n\n⑥ 「好吧！接下來第三題，林芯妤，左右兩邊太靠近了！第四題呢？還不錯，但是字可以再大一點。我來看看第五題，許書豪，你怎麼把橫的題目改成直的呢？」鄭老師無奈的看著許書豪，然後望著全班。\n\n⑦ 「算了！沒關係，黃冠廷、周品妍、張宇哲、林芯妤、許書豪，有寫有功勞，老師各加分一次。」", "paragraph_count": 7, "teacher_notes": ["由老師的評語對應黑板的樣子：第一題在最右邊（地方特色小吃，張宇哲）、第二題已連好線（常見鳥類，黃冠廷）、第三題左右太近（特有農產品，林芯妤）、第四題字太小（歷史事件發生地）、第五題改成直的（國家公園，許書豪）。老師沒點名第四題，用刪去法可知是周品妍。五塊中只有歷史事件那塊沒有「澎湖」，所以沒寫到澎湖的是周品妍。「藍腹鷴」出現在鳥類題，可推知是鳥名。正確配對：墾丁─鵝鑾鼻燈塔、玉山─主峰、太魯閣─燕子口、澎湖南方四島─藍洞；鹿耳門─鄭成功登陸、霧社─霧社事件、金門─八二三砲戰、基隆─清法戰爭；大湖─草莓、麻豆─文旦、澎湖─絲瓜、池上─稻米；臺南─擔仔麵、彰化─肉圓、澎湖─仙人掌冰、新竹─貢丸。"]}, {"id": "m08", "grade_band": "middle", "title": "中年級八〈風力發電機〉", "structure_note": null, "student_text_markdown": "① 在臺灣，不管是西部的海岸、澎湖的小島，還是遠遠的海面上，都看得到一座座高高的風力發電機。\n\n② 為什麼會蓋這麼多風力發電機？簡單說就是為了利用風來發電。臺灣是一個海島，每年秋天和冬天，東北季風吹得又強又穩，特別是海邊和海面上。風不會用完，發電時也不會排放廢氣，因此就在風大的地方蓋了一座又一座風力發電機。\n\n③ 風力發電機工作的道理，就好像我們小時候玩的風車：風一吹，葉片就轉動。不同的是，風力發電機的葉片會帶動裡面的發電機，把「轉動」變成「電」。\n\n④ 科學家發現，越高的地方，風通常越強、越穩，葉片越長，能接住的風也越多，所以風力發電機都蓋得又高又大。但是風有時大、有時小，發出來的電不能直接送到我們家，要先送到變電所調整好，再透過電線送到各地。\n\n⑤ 風力發電機的葉片又長又重，轉起來速度很快，一般人不可以隨便靠近。維修人員要穿戴安全帶，爬上幾十公尺高的塔頂工作；遇到颱風，風力發電機還要停下來，保護自己不被強風吹壞。\n\n⑥ 近年來，風力發電機也引起一些討論。有些住在附近的居民覺得葉片轉動的聲音很吵、影子一直晃動讓人不舒服；也有人擔心飛過的候鳥會撞上葉片。不過，各地的情況不同，研究的結果也不完全一樣，所以大家討論了很多次，還是很難有一致的看法。\n\n⑦ 撇開爭論，用賞景的眼光眺望一排排的風力發電機，沿著海岸線綿延不斷，在藍天下靜靜的轉動，也有另一種美感。白色的塔身、細長的葉片，像一個個巨人站在海邊，對著海風招手。\n\n⑧ 看著它，有人抱怨它太吵、有人慶幸多了乾淨的電、有人欽佩維修人員的辛苦，也有人因為看慣了而沒有感覺。\n\n⑨ 風力發電機離我們又遠又近，你的心裡有它嗎？", "paragraph_count": 9, "teacher_notes": ["配對題可設計為：轉動變成電─發電機、調整後再送出─變電所、居民的擔心─聲音與候鳥、颱風來時─停下來保護自己。臺灣蓋很多風力發電機，是因為海邊風強又穩（第二段）；葉片變長、塔蓋高是為了接住更多風（第四段）。適合的題目是「風力發電機的優點與煩惱」。最後一句「你的心裡有它嗎」是問「你有注意、想過它嗎」，不是指心臟。第三段用「風車」比喻，可用於層次四問寫法效果。"]}, {"id": "h01", "grade_band": "high", "title": "副本一〈終點線前的那一拉〉", "structure_note": "開頭點出「比賽結束但故事流傳」→ 意外發生 → 第一次互助（鼓勵的話）→ 對方要對手先走 → 一起完賽 → 成績、大會破例與兩人的話。層次四可問「引用兩人的話」的效果。", "student_text_markdown": "① 全國國小田徑錦標賽已經落幕，獎牌得主的名字或許會被淡忘，但有一個畫面，許多人一定會記很久。\n\n② 在五月十二日的六年級女子三千公尺預賽中，花蓮代表林以晴跑到第二千公尺時，鞋帶鬆了，腳一絆重重摔在跑道上。緊跟在後的高雄代表陳語彤來不及閃開，也跟著摔倒，手肘和膝蓋都擦破了皮。\n\n③ 陳語彤先撐著地面站了起來，她沒有馬上往前衝，而是伸手拉起林以晴，對她說：「我們練了一整年，不能在這裡停下來。」\n\n④ 林以晴站穩後繼續往前跑，陳語彤則因為腳踝扭傷，每跑一步就痛一次，只好放慢速度。林以晴回頭想等她，陳語彤卻揮手要她快走，別為了自己耽誤比賽。\n\n⑤ 林以晴只好先跑到終點，卻沒有離開，而是站在終點線旁等待。最後一圈，全場觀眾從座位上站起來拍手，陳語彤一拐一拐的通過終點，兩個女孩緊緊抱在一起。\n\n⑥ 兩人的成績分別是十一分五十二秒與十二分三十一秒，是該組的最後兩名。大會裁判團討論後，認為兩人是被意外絆倒，又表現出難得的運動精神，破例讓兩人都進入決賽。陳語彤因為腳踝腫脹，最後沒能上場，但她笑著說：「那時候我什麼都沒想，手就自己伸出去了。」林以晴則說：「以前我只想贏過別人，現在我知道，跑道上也能交到朋友。以後有人問我這場比賽，我會說我的故事裡有陳語彤。」\n\n（自編文本，人物與賽事純屬虛構）", "paragraph_count": 6, "teacher_notes": []}, {"id": "h02", "grade_band": "high", "title": "副本二〈論孝二則〉《論語‧為政》", "structure_note": "兩位學生問同一個問題，孔子給不同的回答，與〈論仁二則〉相同，可延續「因材施教」題型。欄位為原文、注釋、語譯。", "student_text_markdown": "**原文**\n\n① 子游問孝。子曰：「今之孝者，是謂能養[1]。至於犬馬，皆能有養；不敬，何以別[2]乎？」\n\n② 子夏問孝。子曰：「色難[3]。有事，弟子[4]服其勞；有酒食，先生[5]饌[6]，曾[7]是以為孝乎？」\n\n**注釋**\n\n- [1] 養：供養，讓父母有得吃、有得住。\n- [2] 別：區分、分別。\n- [3] 色難：對父母保持和悅的臉色最難。色，臉色、態度。\n- [4] 弟子：這裡指年輕的子女。\n- [5] 先生：這裡指父兄長輩。\n- [6] 饌：音ㄓㄨㄢˋ，吃、飲用。\n- [7] 曾：音ㄗㄥ，難道、竟然。\n\n**語譯**\n\n① 子游請教什麼是孝。孔子說：「現在的人所謂的孝，只是讓父母有飯吃。但就連狗和馬，人也會養牠們；如果對父母沒有敬意，那供養父母和養狗養馬又有什麼不同呢？」\n\n② 子夏請教什麼是孝。孔子說：「最難的是始終保持和悅的態度。有事情時，子女替長輩去做；有飯菜時，先讓長輩享用，難道這樣就算是孝了嗎？」", "paragraph_count": 2, "teacher_notes": []}, {"id": "h03", "grade_band": "high", "title": "副本三〈巷口的豆花攤〉", "structure_note": "第一段寫店的位置、外觀、口味與自己的習慣，再寫搬家後仍偷空去吃；第二段寫「吃的童趣」與童話般的想像，附一個童話注釋。可延續「哪一句看不出赤子之心」「文中沒有提到什麼」題型。", "student_text_markdown": "① 我常去的那個豆花攤，就擺在老家巷口那棵大榕樹下，只有一台推車和三張矮椅子，樹根旁長了一圈稀疏的野草。推車上掛著一盞黃橙橙的小燈籠，燈籠下排著一個個白鐵桶，像一排等著上台的小兵。配料雖然只有花生、紅豆、粉圓、芋圓十幾種，組合起來就有變不完的花樣。可惜不知道為什麼，我每次都點同樣的「花生加粉圓」，很多奇怪的組合至今沒有嘗過，想起來有點可惜。那時常常一坐就是一個傍晚，巷子外面的汽車、喇叭聲，好像都被溫溫的糖水融化了。搬到城裡後則正好相反，明明沒有什麼大事，每天卻忙得團團轉；不過我偶爾還是會抽空，到市場角落那家藍招牌的豆花店吃上一碗，好像一種小小的儀式，吃完就覺得心裡踏實了。\n\n② 吃豆花要帶一點小小的孩子氣，要暫時忘掉大人的那些規矩。比如說碰到一顆粉圓滑溜溜的逃開了，你如果就放棄不吃，那就少了抓到它的樂趣，非要用湯匙在碗裡追它幾圈不可；又譬如說吃到最後，碗底只剩一點糖水和幾顆花生，湯匙怎麼挖也挖不乾淨，這時你也不用不好意思，儘管捧起碗來喝一口，這樣才吃得到最甜的那一口。所以對我來說，無論是榕樹下的推車，或是市場角落的小店，都帶著一層童話的色彩，坐下來就好像掉進了愛麗絲的兔子洞[1]，裡面有會變大變小的食物和一場永遠不會結束的下午茶。所以豆花攤也是和好朋友聊天最好的地方，兩個人低頭吃著溫熱的豆花，話就自然變得特別多；更重要的是，當你問朋友「可不可以嘗一口你的紅豆」而對方笑著把碗推過來時，那表示你們已經是可以分享祕密的好朋友了。\n\n**注釋**\n\n- [1] 愛麗絲的兔子洞：英國童話《愛麗絲夢遊仙境》中，愛麗絲追著一隻兔子掉進洞裡，來到一個充滿奇妙事物的世界。", "paragraph_count": 2, "teacher_notes": []}, {"id": "h04", "grade_band": "high", "title": "副本四〈烤地瓜〉", "structure_note": "第一段寫小吃在臺灣的普及，並給它一個稱號；第二段拿它和其他做法比較，把「傷痕」寫成宿命，並談「選擇就是割捨」；第三段把小吃比作人生。可延續「作者把烤地瓜比作人生，何者不是相似處」「用自己的話解釋稱號」題型。", "student_text_markdown": "① 烤地瓜是臺灣人再熟悉不過的點心。從前的人把地瓜埋進田裡的土窯悶熟，辦年過節的市集裡，老伯伯推著鐵桶叫賣；到了現在，連便利商店的櫃台旁也放著一台烤箱，玻璃門裡的地瓜一條條躺得整整齊齊，表皮焦黑、裂開，飄出甜甜的焦香。它便宜、吃得飽，又一年四季都買得到，從學生到上班族都愛它，有人乾脆稱它為「烤箱裡的黃金」。\n\n② 有時來不及吃早餐，媽媽會在電鍋裡蒸幾條地瓜，蒸出來的地瓜皮薄而完整，口味清淡。烤地瓜則必須經過持久的火烤，和甜品店拿來煮糖水的地瓜不同，它不靠加糖，靠的是自己被烤到糖分慢慢滲出來。那一層焦黑的表皮，乍看像是燒壞了，像一道道傷痕，其實是烤地瓜的宿命。人生本來就免不了經歷一些烤炙。既然走進了烤箱，就回不去剛從土裡挖出來的樣子，就像人回不去童年；那些裂縫、那些焦痕，像手上的繭，像走過的路，粗糙，卻真實，裝滿了時間的味道。既然選擇了被烤，就得放棄被煮成甜湯的可能；就像一個人選擇了當農夫，就難以再當海上的船員。\n\n③ 人生果然像一條烤地瓜，偶爾被烤得焦黑、裂開，像那層粗硬的外皮，有點苦；剝開之後，內心卻是熱騰騰的金黃。苦的外面包著甜的裡面。烤地瓜表現的是一種烤炙之美，外皮裂得越開，糖蜜越賣力的從裂縫冒出來，在表皮上結成亮晶晶的糖片，地瓜肉鬆軟、細密，帶著淡淡的焦香和小小的幸福。", "paragraph_count": 3, "teacher_notes": []}, {"id": "h05", "grade_band": "high", "title": "副本五〈狐假虎威〉《戰國策‧楚策》", "structure_note": "臣子用一個比喻故事回答君王，後來形成成語，與〈三人成虎〉相同。欄位為原文、注釋、解說、語譯。可延續「文意解釋」「成語對應」題型。", "student_text_markdown": "**原文**\n\n① 荊宣王[1]問群臣曰：「吾聞北方之畏昭奚恤[2]也，果誠何如？」群臣莫對。\n\n② 江一[3]對曰：「虎求百獸而食之，得狐。狐曰：『子無敢食我也！天帝使我長[4]百獸，今子食我，是逆[5]天帝命也。子以我為不信，吾為子先行，子隨我後，觀百獸之見我而敢不走[6]乎？』虎以為然，故遂與之行。獸見之皆走。虎不知獸畏己而走也，以為畏狐也。\n\n③ 今王之地方五千里，帶甲[7]百萬，而專屬[8]之昭奚恤；故北方之畏奚恤也，其實畏王之甲兵也，猶百獸之畏虎也。」\n\n**注釋**\n\n- [1] 荊宣王：即楚宣王。荊，楚國的別稱。\n- [2] 昭奚恤：楚國的大臣。恤，音ㄒㄧˋ。\n- [3] 江一：楚國的臣子，也寫作「江乙」。\n- [4] 長：音ㄓㄤˇ，當……的首領。\n- [5] 逆：違背。\n- [6] 走：逃跑。\n- [7] 帶甲：穿著盔甲的士兵。\n- [8] 專屬：全部交給。\n\n**解說**\n\n本文選自戰國策〈楚策〉。楚宣王聽說北方各國都害怕大臣昭奚恤，想知道是不是真的。江一用狐狸借老虎嚇跑百獸的故事，說明各國真正害怕的是楚王的軍隊，而不是昭奚恤本人。後來就衍生出「狐假虎威」這個成語，比喻借別人的勢力來嚇唬人，提醒我們要看清力量真正的來源。\n\n**語譯**\n\n① 楚宣王問大臣們：「我聽說北方各國都害怕昭奚恤，到底是不是真的？」大臣們沒有人回答。\n\n② 江一回答說：「老虎到處找野獸來吃，抓到一隻狐狸。狐狸說：『你不敢吃我！天帝派我當百獸的首領，現在你吃了我，就是違背天帝的命令。你如果不相信，我在前面走，你跟在我後面，看看百獸見到我敢不敢不逃跑？』老虎認為狐狸說得對，就和牠一起走。野獸們一看到牠們就通通逃跑了。老虎不知道野獸是因為害怕自己才逃跑，還以為牠們是害怕狐狸。\n\n③ 現在大王的國土有五千里見方，士兵有一百萬，卻全部交給昭奚恤管理；所以北方各國害怕昭奚恤，其實是害怕大王的軍隊，就像百獸害怕的其實是老虎一樣。」", "paragraph_count": 3, "teacher_notes": []}, {"id": "h06", "grade_band": "high", "title": "副本六〈談將相和〉", "structure_note": "從一齣戲談起 → 指出另一個人物是「典型」→ 他過去的兩件功勞 → 他的缺點與原話 → 主角的沉重心情 → 冒險是不得已 → 計策有效是因為看透對手 → 外表鎮定、內心緊張 → 最後一場的矛盾心情 → 結論：品格在憂患中顯現。可延續「人物在三場戲中的情緒轉變」題型。", "student_text_markdown": "① 京劇裡的戰國戲不算多，但我最喜歡的是〈將相和〉。一齣完整的〈將相和〉要包括「完璧歸趙」「澠池之會」和「負荊請罪」，一頭一尾兩場戲，讓藺相如的性格更加鮮明。這次劇團來學校演出，因為時間不夠，省略了「澠池之會」，不過最精采的部分都演出來了。\n\n② 這齣戲固然是在寫藺相如的智慧與氣度，但我覺得還有別的意義。像廉頗這個人物，就是一個很有代表性的典型。\n\n③ 在趙國，廉頗是一位遠近馳名的大將。據《史記》記載，他立過兩件很大的功勞。第一是帶兵攻打齊國，大獲全勝，取得了陽晉這座城；第二是趙王去澠池和秦王會面時，他守在邊境，讓秦國不敢輕舉妄動。因為過去戰功輝煌，所以他被封為上卿，是趙國最受依靠的將軍。\n\n④ 哪知廉頗卻把自己的功勞看得太重，只認得戰場上的功勞，看不起用口舌立功的人。藺相如因為完璧歸趙、澠池之會有功，官位超過了他，他就心生不平。正如後來三國時代的關羽，也是因為功勞太大、心高氣傲，最後在荊州吃了大虧。戲裡的廉頗對著部下說：「我為趙將，有攻城野戰之大功，而藺相如徒以口舌為勞，而位居我上！」他過去的成功使他驕傲，也差一點讓趙國的將、相反目成仇。有時候，成功和榮耀反而會蒙住一個人的眼睛，這一點在這齣戲裡看得很清楚。\n\n⑤ 藺相如帶著和氏璧走進秦王宮殿時，心情其實是十分沉重的。秦國強、趙國弱，如果交出寶玉卻拿不到城池，趙國不但吃了虧，更會被各國看不起。他看出秦王根本沒有拿城交換的誠意時，心裡的失望與憤怒，可想而知。\n\n⑥ 「持璧睨柱」完全是不得已的。如果乖乖交出寶玉，趙國就白白被騙；如果硬碰硬，又可能引來秦國大軍。這一招不只關係藺相如自己的生死，簡直關係著趙國的尊嚴。藺相如一向謹慎有禮，這時候如果有別的路可走，他也不會拿自己的性命冒險，但局勢逼得他不得不賭一把。\n\n⑦ 他先看清了對手是個愛惜寶玉、又在乎名聲的人，才敢用這個辦法。假如對手不是愛玉的秦王，而是一個只想殺人立威的暴君，這招反而不會生效。秦王之所以讓步，固然是捨不得打碎寶玉，但更重要的，是不想在各國面前落得「為了一塊玉殺使者」的壞名聲。\n\n⑧ 演這齣戲裡的藺相如，我想除了演出他的從容不迫之外，還要體會他當時緊繃的心情。他舉起璧玉、瞪著柱子、髮都快要衝破帽子，那是做給秦王看的；他心裡其實也在打鼓，所以等到帶著璧玉平安回到館舍，向來鎮定的他也不禁長長吐了一口氣。\n\n⑨ 到了最後的「負荊請罪」，則演出了藺相如心情的矛盾。廉頗處處為難他，他不是不氣，但想到「兩虎共鬥，其勢不俱生」，只好一次次躲開。等到廉頗背著荊條來請罪，藺相如扶起他時眼眶泛紅，這不僅是為了多了一個朋友而感動，也是為了趙國終於可以將相同心而欣慰吧。\n\n⑩ 一個人真正的品格，在受委屈時比在風光時更能顯現出來。在這齣戲中，藺相如的情緒有許多變化：出使前的心事重重，發現受騙時的憤怒，面對強敵時的鎮定與膽識，以及被同僚羞辱時的忍讓和寬容，讓我們看到一個真正的大丈夫，怎樣把國家放在前面，把個人的屈辱放在後面。", "paragraph_count": 10, "teacher_notes": []}, {"id": "h07", "grade_band": "high", "title": "副本七〈早班渡船上的阿嬤們〉", "structure_note": "出發目的與期待 → 車（船）上認識的第一批長輩 → 他們下車後，每站又上來更多人 → 司機（船長）與長輩的互動 → 沿途風景 → 讓座與鄰座長輩 → 問年紀的趣事 → 抵達、魚貫下船 → 市場重逢 → 結尾感想。可延續「主旨」「哪一句無法凸顯人情互動」「作者特別選擇清晨出發的原因」題型。", "student_text_markdown": "① 清晨六點半，我和寫詩的朋友阿哲約好，從漁光村碼頭搭早班渡船，準備到對岸的新港市場買菜。碼頭邊已經有好幾位老人家和背著書包的國中生在等船。這幾天正是白鷺鷥成群的季節，選這班沿著海灣停靠的渡船，我猜一路上應該能看到不少鳥。再說，一大早到市場，說不定還能遇到剛靠岸的漁船在賣漁獲呢！\n\n② 上船時，我和阿哲想坐在最前面，好跟船長聊天。但有位阿公一上船，就搶先坐進駕駛艙旁的第一個位子。他扛著一根長長的釣竿，提著一個塑膠水桶，戴著斗笠，看起來就是要去海邊大顯身手。我好奇的問了問，他果然要去防波堤釣黑鯛，水桶是用來裝魚的。我借來他的釣竿掂了掂，比想像中重得多，不常釣魚的我，大概甩不了幾下手就痠了。我們熱絡的聊起釣魚的訣竅，還有黑鯛要怎麼煮才好吃。一位坐在後排的阿嬤，聽我們聊得起勁，也忍不住加入。她在新港市場口的麵攤幫忙，要我有空一定去吃一碗。\n\n③ 船靠第一站，她要下船了，還特別回頭告訴我麵攤在哪個轉角，好像很怕我找不到。後來，阿公也在燈塔站下了船。我以為接下來船上會安靜一些，可以專心看鳥了。沒想到，每一站碼頭上都站著三四位阿公阿嬤，伸長脖子，等著這班船靠岸。\n\n④ 上船的老人家大多穿著樸素，臉被海風和太陽曬得黝黑，滿是皺紋。船長在這條航線開了二十多年，每一位都叫得出名字。誰的腳不方便、誰習慣在哪一站上下船，他心裡都有數，所以總是等他們慢慢站穩、坐好，才把船開走，還會提醒他們「慢慢來，免趕」。聽說前陣子，鄉長還特別拜託渡船公司，請船長們盡量開穩一點，靠岸時慢一點。畢竟搭這條航線的，除了上學的孩子，大多是老人家；船開得穩，他們才放心，也就更常搭了。\n\n⑤ 一路上，白鷺鷥真的成群飛過海面。我忍不住想像，如果從天空往下看，這艘小船在藍色的海灣裡畫出一道白色的浪痕，兩旁的灘地上停滿了白鷺鷥，該是多美的畫面。\n\n⑥ 老人家越來越多，阿哲讓出位子，退到船尾去站。我還想跟船長攀談，就擠到前面引擎旁邊，一個又吵又不好坐的位置。十來分鐘裡，我旁邊的位子換了兩位阿嬤，我提醒她們抓好扶手，她們都笑笑不理我。第一位說著又快又急的臺語，我只聽懂一半。第二位抱著一大籃菜，我問她籃子裡裝的是什麼菜，她說：「男人家問這個做什麼？」怎麼也不肯告訴我。我問她要去哪裡，她說要去新港市場買菜。那一排的幾位阿嬤，雖然是在不同站上船的，竟然都要去同一個市場。我說好巧，我也是。\n\n⑦ 她們不相信，從我的穿著打扮看來，怎麼看都不像是要去買菜的人。阿哲走過來，站在走道上替我作證，還順便問了旁邊幾位阿嬤的年紀。到了這個歲數，大家倒也不忌諱。我旁邊那位很爽快，直接說八十四。阿哲嚇了一跳，再問隔壁，八十二；再旁邊，八十一；還有一位，七十九。這一整排要去買菜的人裡，就屬我最年輕，還不到六十。阿哲一算，忍不住大笑。這時，後面有位阿嬤用力拍了拍我的肩膀，我回頭，只見她指著自己，得意的說：「我卡少年啦，才七十八！」\n\n⑧ 我笑得合不攏嘴，阿哲差點連站都站不穩。接下來，我已經沒心思看什麼白鷺鷥了，阿嬤們你一句、我一句，都在聊新港市場哪一攤的魚最新鮮。整艘船就在這片熱鬧的說話聲中，慢慢的穿過海灣。可惜時間過得太快，沒多久，新港碼頭就到了。幾乎所有阿嬤都站了起來，排成一列，二三十人，一個接一個走下船。我們兩個也排在隊伍裡。\n\n⑨ 下了船，大家都往熱鬧的市場走去。一路上，我們落在後面，忙著東看西看，一邊找朋友託我買的小魚乾。走到一半，有人過來和我們打招呼，原來是那位七十八歲的阿嬤。她已經買好菜要回家了，打開袋子讓我看，只有一尾小魚和一把青蔥。這麼快，這樣就夠了嗎？她點點頭說，一個人吃，一道菜就夠了。再說，滿六十五歲搭渡船不用錢，她樂得每天搭船來市場走一趟。\n\n⑩ 人生匆匆，在旅途中，難得遇見這麼多可愛的阿嬤。白鷺鷥的季節過去以後，我相信自己還會有很多個清晨，回到這片海灣，坐上這班慢慢搖晃的渡船。\n\n（自編文本，地名與人物純屬虛構）", "paragraph_count": 10, "teacher_notes": []}, {"id": "h08", "grade_band": "high", "title": "副本八〈春日憶李白〉杜甫", "structure_note": "詩人寫給（或懷念）另一位詩人的五言律詩，開頭稱讚對方、中間描寫、結尾表達心意，首尾互相呼應，與〈贈孟浩然〉相同。欄位為原詩、注釋、語譯。可延續「前後呼應」「本詩主旨」題型。", "student_text_markdown": "**原詩**\n\n白也[1]詩無敵，飄然[2]思不群[3]。\n\n清新庾開府[4]，俊逸[5]鮑參軍[6]。\n\n渭北[7]春天樹，江東[8]日暮雲。\n\n何時一尊[9]酒，重與細論文[10]？\n\n**注釋**\n\n- [1] 白也：指李白。「也」是語氣詞，表示親切的稱呼。\n- [2] 飄然：灑脫、不受拘束的樣子。\n- [3] 思不群：想法與眾不同，超出一般人。\n- [4] 庾開府：南北朝詩人庾信，曾任「開府」的官職，詩風清新。\n- [5] 俊逸：才華出眾，風格瀟灑。\n- [6] 鮑參軍：南朝詩人鮑照，曾任「參軍」的官職，詩風俊逸。\n- [7] 渭北：渭水以北，指杜甫當時所在的長安一帶。\n- [8] 江東：長江下游一帶，指李白當時所在的地方。\n- [9] 尊：同「樽」，酒杯。\n- [10] 論文：討論詩文。\n\n**語譯**\n\n李白啊，你的詩天下無人能比，你的想法灑脫自在，和一般人完全不同。你的詩像庾信一樣清新，又像鮑照一樣俊逸。如今我在渭水北岸，看著春天的樹木；你在遙遠的江東，望著黃昏的雲彩，我們各在一方，只能互相思念。什麼時候我們才能再一起舉杯喝酒，像從前那樣仔細的討論詩文呢？", "paragraph_count": 4, "teacher_notes": []}, {"id": "h09", "grade_band": "high", "title": "副本九〈犬兔之爭〉《戰國策‧齊策》", "structure_note": "一國想打另一國，說客用「兩個爭鬥者都耗盡力氣，第三者撿便宜」的寓言勸阻，君王聽從而停戰，與〈鷸蚌相爭〉相同。欄位為題解、原文、注釋、語譯。可與〈鷸蚌相爭〉做多文本比較。", "student_text_markdown": "**題解**\n\n戰國時代，各國互相攻打。有一次齊國打算攻打魏國，齊國的謀士淳于髡認為，齊、魏兩國長期對抗，只會把兵力和人民都拖垮，強大的秦國、楚國反而會趁機得利。他沒有直接勸齊王停兵，而是講了一個獵狗追兔子的故事。齊王聽了，立刻放棄攻打魏國的計畫。後來「犬兔之爭」用來比喻雙方爭鬥不休，兩敗俱傷，而讓第三者得到好處。\n\n**原文**\n\n① 齊欲伐魏。淳于髡[1]謂齊王曰：「韓子盧[2]者，天下之疾[3]犬也。東郭逡[4]者，海內之狡[5]兔也。韓子盧逐東郭逡，環山者三，騰[6]山者五，兔極[7]於前，犬廢[8]於後，犬兔俱罷[9]，各死其處。田父[10]見而獲之，無勞勌[11]之苦，而擅[12]其功。\n\n② 今齊、魏久相持，以頓[13]其兵，弊其眾，臣恐強秦、大楚承其後，有田父之功。」齊王懼，謝將休士也。\n\n**注釋**\n\n- [1] 淳于髡：齊國的謀士，以口才好、善於說笑話勸諫聞名。髡，音ㄎㄨㄣ。\n- [2] 韓子盧：獵狗的名字。\n- [3] 疾：跑得快。\n- [4] 東郭逡：兔子的名字。逡，音ㄑㄩㄣ。\n- [5] 狡：狡猾、機靈。\n- [6] 騰：翻越。\n- [7] 極：精疲力盡。\n- [8] 廢：筋疲力竭而倒下。\n- [9] 罷：同「疲」。\n- [10] 田父：老農夫。父，音ㄈㄨˇ。\n- [11] 勞勌：勞累。勌，同「倦」。\n- [12] 擅：獨佔。\n- [13] 頓：使……疲累。\n\n**語譯**\n\n① 齊國想要攻打魏國。淳于髡對齊王說：「韓子盧是天下跑得最快的獵狗；東郭逡是天下最機靈的兔子。韓子盧追趕東郭逡，繞著山跑了三圈，翻過山頭五次，兔子在前面跑得精疲力盡，獵狗在後面追得筋疲力竭，狗和兔子都累得倒下，各自死在原地。一位老農夫看到了，把牠們一起撿走，一點也不費力，就獨自得到了好處。\n\n② 現在齊國和魏國長期對峙，兩國的軍隊和人民都疲憊不堪，我擔心強大的秦國和楚國會跟在後面，成為那個得利的老農夫。」齊王聽了很害怕，就遣散將領、讓士兵休息，不再攻打魏國了。", "paragraph_count": 2, "teacher_notes": []}, {"id": "h10", "grade_band": "high", "title": "副本十〈鄒忌諷齊王納諫〉《戰國策‧齊策》", "structure_note": "題解介紹人物與時代 → 原文寫一位謀士用巧妙的方法幫助主上 → 注釋 → 語譯 → 典故說明，解釋文中產生的成語，與〈狡兔三窟〉相同。原文較長，適合高年級挑戰關。", "student_text_markdown": "**題解**\n\n戰國時代，各國君王都希望國家強大。齊國的相國鄒忌是一位長相出眾、能言善道的大臣。有一天，他發現妻子、小妾和客人都說他比城北的徐公好看，但他親眼見到徐公後，才知道自己差得遠。他想通了大家說好話的原因，便用這件小事勸齊威王：身為君王，聽到的讚美更多，被蒙蔽得也更深。齊威王接受勸告，鼓勵臣民指出自己的過錯，齊國因此日漸強大。\n\n**原文**\n\n① 鄒忌脩[1]八尺有餘，而形貌昳麗[2]。朝服衣冠，窺鏡，謂其妻曰：「我孰與城北徐公美？」其妻曰：「君美甚，徐公何能及君也！」城北徐公，齊國之美麗者也。忌不自信，而復問其妾曰：「吾孰與徐公美？」妾曰：「徐公何能及君也！」旦日[3]，客從外來，與坐談，問之客曰：「吾與徐公孰美？」客曰：「徐公不若君之美也！」\n\n② 明日，徐公來，孰視[4]之，自以為不如；窺鏡而自視，又弗如遠甚。暮寢而思之，曰：「吾妻之美我者，私[5]我也；妾之美我者，畏我也；客之美我者，欲有求於我也。」\n\n③ 於是入朝見威王，曰：「臣誠知不如徐公美，臣之妻私臣，臣之妾畏臣，臣之客欲有求於臣，皆以美於徐公。今齊地方千里，百二十城，宮婦左右，莫不私王；朝廷之臣，莫不畏王；四境之內，莫不有求於王。由此觀之，王之蔽[6]甚矣！」\n\n④ 王曰：「善。」乃下令：「群臣吏民能面刺[7]寡人之過者，受上賞；上書諫寡人者，受中賞；能謗議[8]於市朝[9]，聞寡人之耳者，受下賞。」令初下，群臣進諫，門庭若市；數月之後，時時而間[10]進；期年[11]之後，雖欲言，無可進者。燕、趙、韓、魏聞之，皆朝[12]於齊。此所謂戰勝於朝廷。\n\n**注釋**\n\n- [1] 脩：同「修」，身高。\n- [2] 昳麗：容貌光彩美麗。昳，音ㄧˋ。\n- [3] 旦日：第二天。\n- [4] 孰視：仔細的看。孰，同「熟」。\n- [5] 私：偏愛。\n- [6] 蔽：受蒙蔽，看不清真相。\n- [7] 面刺：當面指責。\n- [8] 謗議：公開批評議論。\n- [9] 市朝：公共場所。\n- [10] 間：音ㄐㄧㄢˋ，偶爾、間或。\n- [11] 期年：滿一年。期，音ㄐㄧ。\n- [12] 朝：音ㄔㄠˊ，到齊國朝見，表示尊敬。\n\n**語譯**\n\n① 鄒忌身高八尺多，容貌光彩出眾。有一天早上，他穿戴好衣帽，照著鏡子，問妻子：「我和城北的徐公比，誰比較好看？」妻子說：「您好看多了，徐公怎麼比得上您呢！」城北的徐公，是齊國有名的美男子。鄒忌不太相信，又去問小妾：「我和徐公比，誰比較好看？」小妾說：「徐公怎麼比得上您呢！」第二天，有客人來拜訪，鄒忌和他坐著聊天，又問客人：「我和徐公比，誰比較好看？」客人說：「徐公沒有您好看。」\n\n② 又過了一天，徐公來了，鄒忌仔細看他，覺得自己比不上；再照照鏡子看自己，更覺得差得遠了。晚上躺在床上想這件事，他說：「妻子說我好看，是因為偏愛我；小妾說我好看，是因為怕我；客人說我好看，是因為有事想求我。」\n\n③ 於是鄒忌上朝去見齊威王，說：「我明明知道自己沒有徐公好看，但我的妻子偏愛我，我的小妾怕我，我的客人有求於我，所以都說我比徐公好看。現在齊國土地方圓千里，有一百二十座城，宮裡的妃子和身邊的人，沒有不偏愛大王的；朝廷的大臣，沒有不怕大王的；全國的百姓，沒有不有求於大王的。這樣看來，大王受到的蒙蔽實在太深了！」\n\n④ 齊威王說：「說得好。」就下了一道命令：「所有大臣、官員和百姓，能當面指出我的過錯的，得上等獎賞；寫信勸告我的，得中等獎賞；能在公共場所批評議論、讓我聽到的，得下等獎賞。」命令剛發布時，來進言的大臣多得像市場一樣熱鬧；幾個月以後，偶爾才有人來；滿一年以後，就算有人想進言，也找不到可以說的了。燕、趙、韓、魏各國聽說了，都來朝見齊國。這就是所謂「不用出兵，在朝廷上就打了勝仗」。\n\n**典故說明**\n\n「門庭若市」原本形容來進言的人多，門口和庭院像市場一樣擠滿了人；後來用來形容來往的客人很多、非常熱鬧。這個故事也告訴我們：身邊的人常因為偏愛、害怕或有所求而只說好聽的話，一個人要能分辨真假，並且歡迎別人指出自己的錯誤，才能不斷進步。", "paragraph_count": 4, "teacher_notes": []}], "quests": [{"quest_id": "h06-q1", "text_id": "h06", "title": "談將相和", "grade_band": "high", "genre": "議論", "paragraph_count": 10, "settings": {"unlock_rule": "per_level_3_of_5", "hint_costs_points": true, "read_aloud": false, "zhuyin": false}, "warm_up": {"prompt": "看到標題〈談將相和〉，你猜文章會談什麼？", "options": ["一齣戲裡的人物", "一場體育比賽", "一道料理的做法", "一次旅行的經過"], "scored": false}, "questions": [{"qid": "q01", "level": 1, "level_name": "提取訊息", "sublevel": null, "stem": "這次劇團來學校演出時，省略了哪一場戲？", "options": {"A": "完璧歸趙", "B": "澠池之會", "C": "負荊請罪", "D": "持璧睨柱"}, "answer": "B", "evidence_paragraph": [1], "evidence_quote": "省略了「澠池之會」", "hint": "回到第 1 段，找一找「省略」這兩個字。", "option_feedback": {"A": "完璧歸趙有演出來喔，再看一次哪一場沒有演。", "C": "完整的戲有三場，你選的這一場有演出，再看清楚被省略的是哪一場。", "D": "這是戲裡的一個動作，不是一場戲的名稱。"}, "teacher": {"intent": "檢核學生能否找出文中明寫的資訊，屬層次一。", "misconception": "記得完整的戲有三場，卻沒看清楚哪一場被省略。", "teaching_point": "題目問「省略」時，要回到原句確認，不能只憑印象。"}}, {"qid": "q02", "level": 1, "level_name": "提取訊息", "sublevel": null, "stem": "根據第 3 段，廉頗帶兵攻打齊國後，取得了哪一座城？", "options": {"A": "陽晉", "B": "澠池", "C": "荊州", "D": "咸陽"}, "answer": "A", "evidence_paragraph": [3], "evidence_quote": "取得了陽晉這座城", "hint": "第 3 段寫了廉頗的「第一」件功勞，找找那座城的名字。", "option_feedback": {"B": "澠池是趙王和秦王會面的地方，不是廉頗打下來的城。", "C": "荊州出現在第 4 段，和關羽有關，不是廉頗的功勞。", "D": "文章裡沒有提到這個地方，答案要從文章裡找。"}, "teacher": {"intent": "檢核學生能否在同一段中找出明寫的地名，屬層次一。", "misconception": "文中地名不少，學生可能把會面地點或關羽的事混進來。", "teaching_point": "同一段有多個專有名詞時，要看清楚每個名詞和哪件事搭配。"}}, {"qid": "q03", "level": 1, "level_name": "提取訊息", "sublevel": null, "stem": "廉頗為什麼能被封為上卿？", "options": {"A": "因為完璧歸趙有功", "B": "因為口才勝過藺相如", "C": "因為過去戰功輝煌", "D": "因為和秦王交情深"}, "answer": "C", "evidence_paragraph": [3], "evidence_quote": "因為過去戰功輝煌，所以他被封為上卿", "hint": "第 3 段最後一句有「所以」，看看「所以」前面寫了什麼。", "option_feedback": {"A": "完璧歸趙是藺相如立的功，再看看廉頗的功勞是什麼。", "B": "文章說廉頗看不起用口舌立功的人，他靠的不是口才。", "D": "文中沒有說廉頗和秦王有交情，他是讓秦國不敢輕舉妄動的人。"}, "teacher": {"intent": "檢核學生能否找出「因為……所以……」句中明寫的原因，屬層次一。", "misconception": "把藺相如的功勞誤記到廉頗身上。", "teaching_point": "找原因時，先找「因為、所以」等連接詞，再看它連接的兩件事。"}}, {"qid": "q04", "level": 1, "level_name": "提取訊息", "sublevel": null, "stem": "藺相如帶著璧玉平安回到館舍後，有什麼反應？", "options": {"A": "放聲大笑", "B": "長長吐了一口氣", "C": "立刻寫信回趙國", "D": "流下感動的眼淚"}, "answer": "B", "evidence_paragraph": [8], "evidence_quote": "不禁長長吐了一口氣", "hint": "回到第 8 段最後一句，看看他「回到館舍」以後做了什麼。", "option_feedback": {"A": "文中沒有寫他笑，再找找第 8 段的最後一句。", "C": "文中沒有提到寫信，答案就在第 8 段。", "D": "眼眶泛紅是第 9 段負荊請罪時的事，不是回到館舍的時候。"}, "teacher": {"intent": "檢核學生能否找出指定情境下人物的反應，屬層次一。", "misconception": "把第 9 段眼眶泛紅的情節，誤用到第 8 段的情境。", "teaching_point": "題目有時間或地點條件時（回到館舍後），要先找到那個時間點再讀。"}}, {"qid": "q05", "level": 1, "level_name": "提取訊息", "sublevel": null, "stem": "根據第 7 段，秦王讓步「更重要」的原因是什麼？", "options": {"A": "捨不得打碎寶玉", "B": "害怕廉頗帶兵攻打", "C": "想和趙國交換城池", "D": "不想落得殺使者的壞名聲"}, "answer": "D", "evidence_paragraph": [7], "evidence_quote": "更重要的，是不想在各國面前落得……壞名聲", "hint": "第 7 段有「固然……但更重要的……」，答案在「更重要的」後面。", "option_feedback": {"A": "這是原因之一，但文章說還有「更重要」的原因。", "B": "第 7 段沒有提到廉頗，秦王讓步和他無關。", "C": "第 5 段說秦王根本沒有拿城交換的誠意。"}, "teacher": {"intent": "檢核學生能否分辨「固然……更重要的是」句型中的主要原因，屬層次一。", "misconception": "只讀到「捨不得打碎寶玉」就停下，沒讀完後半句。", "teaching_point": "看到「固然……但更重要的」時，作者真正強調的是後面那一半。"}}, {"qid": "q06", "level": 2, "level_name": "推論分析", "sublevel": null, "stem": "根據第 3 段和第 4 段，廉頗對藺相如心生不平，主要是因為什麼？", "options": {"A": "他認為只有戰功才算真功勞", "B": "他認為藺相如對趙王不忠", "C": "他嫉妒藺相如很受人喜愛", "D": "他擔心藺相如會投靠秦國"}, "answer": "A", "evidence_paragraph": [3, 4], "evidence_quote": "只認得戰場上的功勞，看不起用口舌立功的人", "hint": "把第 3 段廉頗的功勞，和第 4 段他「看不起」誰連起來想。", "option_feedback": {"B": "文中沒有說藺相如不忠，藺相如反而一直為趙國著想。", "C": "文中沒有提到誰比較受歡迎，再看看廉頗說的那句話。", "D": "藺相如是為了趙國對抗秦國，文中沒有投靠秦國的線索。"}, "teacher": {"intent": "檢核學生能否連結第 3、4 段，推論人物心生不平的原因，屬層次二。", "misconception": "用生活經驗把「不平」想成嫉妒人緣，而沒有回到廉頗的原話。", "teaching_point": "推論人物心理時，要以人物自己說的話和做的事為依據。"}}, {"qid": "q07", "level": 2, "level_name": "推論分析", "sublevel": null, "stem": "綜合第 5 段和第 6 段，藺相如決定「持璧睨柱」，最主要是因為什麼？", "options": {"A": "他想在秦王面前展現勇氣", "B": "交出或硬拚都會讓趙國受害", "C": "他早就打算打碎和氏璧", "D": "秦王事先答應不會殺他"}, "answer": "B", "evidence_paragraph": [5, 6], "evidence_quote": "如果乖乖交出寶玉……如果硬碰硬……", "hint": "第 6 段用了兩個「如果」，想一想兩條路各會帶來什麼結果。", "option_feedback": {"A": "第 6 段說他一向謹慎，這樣做是「不得已」，不是為了表現自己。", "C": "他是用「打碎」來嚇阻秦王，不是本來就想打碎它。", "D": "文中沒有寫秦王答應過什麼，第 6 段說這招關係著他的生死。"}, "teacher": {"intent": "檢核學生能否整合兩段的處境描述，推論人物做決定的原因，屬層次二。", "misconception": "把「持璧睨柱」看成逞強，忽略文中「不得已」的說明。", "teaching_point": "人物的冒險行為，要回到文中交代的處境來理解。"}}, {"qid": "q08", "level": 2, "level_name": "推論分析", "sublevel": null, "stem": "根據第 6 段和第 8 段，藺相如在秦王面前的狀態最接近哪一項？", "options": {"A": "心中毫不害怕，早有十足把握", "B": "因為太生氣而忘了要冷靜", "C": "外表強硬，其實內心也很緊張", "D": "只顧著保住自己的性命"}, "answer": "C", "evidence_paragraph": [6, 8], "evidence_quote": "那是做給秦王看的；他心裡其實也在打鼓", "hint": "比較第 8 段「做給秦王看的」和「心裡其實」兩部分。", "option_feedback": {"A": "第 6 段說他是「賭一把」，第 8 段說他心裡在打鼓，不是毫不害怕。", "B": "第 8 段說他瞪柱子是「做給秦王看的」，他其實很清楚自己在做什麼。", "D": "第 6 段說這一招關係著趙國的尊嚴，他想的不只是自己。"}, "teacher": {"intent": "檢核學生能否結合兩段描寫，推論人物外在表現與內心的落差，屬層次二。", "misconception": "只看到怒髮衝冠的動作，就以為他是真的失控或毫不害怕。", "teaching_point": "人物的外表和內心可能不一樣，要同時看動作描寫與心理描寫。"}}, {"qid": "q09", "level": 2, "level_name": "推論分析", "sublevel": null, "stem": "根據第 4 段和第 9 段，廉頗後來「負荊請罪」，最可能代表他有什麼改變？", "options": {"A": "他想要辭去上卿的官位", "B": "他害怕藺相如向趙王告狀", "C": "他打算請藺相如教他口才", "D": "他承認自己過去看輕了對方"}, "answer": "D", "evidence_paragraph": [4, 9], "evidence_quote": "看不起用口舌立功的人／背著荊條來請罪", "hint": "先看第 4 段廉頗原本怎麼看藺相如，再看第 9 段他做了什麼。", "option_feedback": {"A": "文中沒有提到他要辭官，請罪是對藺相如的態度改變。", "B": "文中沒有告狀的情節，藺相如一直選擇忍讓。", "C": "請罪是承認錯誤，文中沒有他想學口才的線索。"}, "teacher": {"intent": "檢核學生能否對照人物前後行為，推論其態度轉變，屬層次二。", "misconception": "用常識猜想請罪的動機，而沒有對照第 4 段廉頗原本的想法。", "teaching_point": "人物前後的行為不同時，可以比較前後，推論他改變了什麼。"}}, {"qid": "q10", "level": 2, "level_name": "推論分析", "sublevel": null, "stem": "根據第 5 段和第 7 段，藺相如的計策能成功，是因為他先做到了哪件事？", "options": {"A": "事先調來趙國大軍", "B": "先摸清秦王在乎什麼", "C": "把寶玉藏在館舍裡", "D": "請廉頗在邊境支援"}, "answer": "B", "evidence_paragraph": [5, 7], "evidence_quote": "他先看清了對手是個愛惜寶玉、又在乎名聲的人", "hint": "第 7 段第一句說他「先」做了什麼，才敢用這個辦法。", "option_feedback": {"A": "第 6 段說硬碰硬可能引來秦國大軍，他沒有調兵。", "C": "他是拿著璧玉威脅要打碎，寶玉並沒有藏起來。", "D": "廉頗守邊境是澠池之會時的事，不是這一次。"}, "teacher": {"intent": "檢核學生能否連結兩段，推論計策成功的條件，屬層次二。", "misconception": "把第 3 段廉頗守邊境的情節，套用到完璧歸趙的事件上。", "teaching_point": "推論時要確認線索屬於同一個事件，不能把不同事件混在一起。"}}, {"qid": "q11", "level": 3, "level_name": "詮釋整合", "sublevel": null, "stem": "下列哪一項最接近本文的主旨？", "options": {"A": "京劇演出要懂得刪減場次", "B": "戰場功勞比口舌之功更重要", "C": "困境與委屈最能看出人的品格", "D": "強國總是靠計謀欺負弱國"}, "answer": "C", "evidence_paragraph": [10], "evidence_quote": "真正的品格，在受委屈時比在風光時更能顯現", "hint": "主旨常常在文章的開頭或結尾，讀讀最後一段的第一句。", "option_feedback": {"A": "省略場次只是第 1 段開頭的一個細節，不是全文重點。", "B": "這是廉頗原本的想法，作者認為這個想法讓他驕傲。", "D": "文中講秦國的部分只是情節背景，作者重點在人物的品格。"}, "teacher": {"intent": "檢核學生能否統整全文，找出作者想傳達的核心觀點，屬層次三。", "misconception": "把文中人物的觀點（廉頗）當作作者的觀點。", "teaching_point": "找主旨時要分清楚「誰說的」：人物的看法不一定是作者的看法。"}}, {"qid": "q12", "level": 3, "level_name": "詮釋整合", "sublevel": null, "stem": "全文提到廉頗，主要是用他來說明什麼？", "options": {"A": "武將比文臣更受國家重視", "B": "過去的成就可能使人驕傲", "C": "趙國將軍都不尊重宰相", "D": "有戰功的人終究會吃大虧"}, "answer": "B", "evidence_paragraph": [2, 3, 4], "evidence_quote": "他過去的成功使他驕傲", "hint": "第 2 段說廉頗是一個「典型」，到第 4 段找找作者怎麼評論他。", "option_feedback": {"A": "第 4 段說藺相如官位超過廉頗，文中沒有說武將更受重視。", "C": "文中只寫廉頗一個人，不能推到所有將軍。", "D": "關羽吃虧只是作者舉的例子；廉頗後來請罪，將相和好。"}, "teacher": {"intent": "檢核學生能否從多個段落整合，理解某個人物在全文中的作用，屬層次三。", "misconception": "把關羽的例子過度推論成「有戰功一定吃虧」。", "teaching_point": "例子是用來支持作者觀點的，要回頭找作者真正想說的那句話。"}}, {"qid": "q13", "level": 3, "level_name": "詮釋整合", "sublevel": null, "stem": "下列哪一項最能概括第 6 段到第 8 段的內容？", "options": {"A": "藺相如持璧睨柱的苦衷、判斷與心情", "B": "廉頗與藺相如之間衝突的經過", "C": "秦王為什麼不肯交出城池", "D": "京劇演員怎樣練習舞臺動作"}, "answer": "A", "evidence_paragraph": [6, 7, 8], "evidence_quote": "「持璧睨柱」完全是不得已的……", "hint": "把第 6、7、8 段各用一句話說說看，再找共同的主角和事件。", "option_feedback": {"B": "將相衝突寫在第 4 段和第 9 段，不是這三段的重點。", "C": "這三段在談藺相如怎麼應對，不是在解釋秦王的想法。", "D": "第 8 段雖然談到演戲，但重點是藺相如的心情，不是練習動作。"}, "teacher": {"intent": "檢核學生能否概括連續段落的共同內容，屬層次三。", "misconception": "被第 8 段「演這齣戲」吸引，把段落重點誤認為演員。", "teaching_point": "概括多段內容時，先各段找重點，再找共同的人物與事件。"}}, {"qid": "q14", "level": 3, "level_name": "詮釋整合", "sublevel": null, "stem": "綜觀全文，藺相如和廉頗最大的不同在於什麼？", "options": {"A": "帶兵打仗的本領高低", "B": "受趙王信任的程度", "C": "家世出身是否高貴", "D": "面對個人得失的態度"}, "answer": "D", "evidence_paragraph": [4, 9, 10], "evidence_quote": "把國家放在前面，把個人的屈辱放在後面", "hint": "想想廉頗在第 4 段怎麼看待官位，藺相如在第 9、10 段怎麼面對委屈。", "option_feedback": {"A": "文中沒有比較兩人打仗的本領，藺相如的功勞不是靠打仗。", "B": "兩人都受到重用，這不是作者想強調的差別。", "C": "文中完全沒有提到兩人的家世。"}, "teacher": {"intent": "檢核學生能否比較兩個人物在全文中的整體差異，屬層次三。", "misconception": "注意到官位高低，卻沒有看到作者真正比較的是兩人的態度。", "teaching_point": "比較人物時，先找作者對兩人分別的評語，再找差異。"}}, {"qid": "q15", "level": 3, "level_name": "詮釋整合", "sublevel": null, "stem": "本文最主要的寫作目的是什麼？", "options": {"A": "藉一齣戲談人物的品格", "B": "介紹京劇的唱腔與服裝", "C": "考證《史記》的記載對錯", "D": "說明戰國各國的地理位置"}, "answer": "A", "evidence_paragraph": [1, 2, 10], "evidence_quote": "這齣戲……我覺得還有別的意義", "hint": "看第 2 段作者說這齣戲「還有別的意義」，再對照最後一段。", "option_feedback": {"B": "文中幾乎沒有談唱腔和服裝，京劇只是引子。", "C": "作者引用《史記》是為了交代廉頗的功勞，不是在考證對錯。", "D": "地名只是故事背景，作者沒有說明地理位置。"}, "teacher": {"intent": "檢核學生能否從全文判斷作者的寫作目的，屬層次三。", "misconception": "被開頭的京劇話題吸引，誤以為全文在介紹京劇。", "teaching_point": "開頭的話題常是引子，要讀到結尾才知道作者真正要談什麼。"}}, {"qid": "q16", "level": 4, "level_name": "評估與評論", "sublevel": "4A", "stem": "作者引用廉頗對部下說的話，主要效果是什麼？", "options": {"A": "說明藺相如立下了哪些功勞", "B": "交代趙國和秦國打仗的時間", "C": "讓讀者看見廉頗不服氣的心態", "D": "證明趙王非常信任廉頗"}, "answer": "C", "evidence_paragraph": [4], "evidence_quote": "我為趙將，有攻城野戰之大功……而位居我上！", "hint": "讀讀廉頗那句話的語氣，他是在讚美還是在抱怨？", "option_feedback": {"A": "廉頗的話提到藺相如，但重點是他自己的不服氣。", "B": "這句話裡沒有任何時間的資訊。", "D": "這句話在說廉頗對藺相如的不滿，和趙王是否信任他無關。"}, "teacher": {"intent": "檢核學生能否評估「引用人物原話」這個寫法的效果，屬層次四 A。", "misconception": "看到話中提到藺相如，就以為在介紹藺相如的功勞。", "teaching_point": "引用人物的話，常用來讓讀者自己看見人物的性格與心態。"}}, {"qid": "q17", "level": 4, "level_name": "評估與評論", "sublevel": "4A", "stem": "第 8 段寫藺相如「髮都快要衝破帽子」，這樣描寫的效果是什麼？", "options": {"A": "說明他當時戴的帽子太小", "B": "暗示他其實不在乎寶玉", "C": "表示他已準備逃出宮殿", "D": "用誇張寫法表現他的怒氣"}, "answer": "D", "evidence_paragraph": [8], "evidence_quote": "髮都快要衝破帽子，那是做給秦王看的", "hint": "頭髮真的會衝破帽子嗎？想一想作者為什麼要寫得這麼誇張。", "option_feedback": {"A": "這是誇張的寫法，不是真的在說帽子的大小。", "B": "他就是為了保住寶玉才這樣做，不是不在乎。", "C": "文中沒有逃走的線索，他是在正面和秦王對峙。"}, "teacher": {"intent": "檢核學生能否評估誇飾描寫的表達效果，屬層次四 A。", "misconception": "把誇飾當成真實的描述來理解。", "teaching_point": "誇張的描寫是為了強化情緒或氣氛，不是在說真實的情況。"}}, {"qid": "q18", "level": 4, "level_name": "評估與評論", "sublevel": "4A", "stem": "第 4 段提到三國時代的關羽，作者這樣寫的主要作用是什麼？", "options": {"A": "用相似例子加強驕傲會吃虧的看法", "B": "說明關羽和廉頗是同時代的人", "C": "介紹關羽在荊州打仗的經過", "D": "證明廉頗的本領比關羽更高"}, "answer": "A", "evidence_paragraph": [4], "evidence_quote": "正如後來三國時代的關羽……最後在荊州吃了大虧", "hint": "注意「正如」這兩個字，作者把關羽和誰放在一起比？", "option_feedback": {"B": "文中寫的是「後來三國時代」，兩人不同時代。", "C": "關羽的事只寫了一句，作者不是要介紹他的經過。", "D": "文中沒有比較兩人的本領高低。"}, "teacher": {"intent": "檢核學生能否評估「舉例」這個寫法對論點的作用，屬層次四 A。", "misconception": "以為提到某個人物就是要介紹他，沒有看到「正如」的類比作用。", "teaching_point": "作者舉相似的例子，是為了讓自己的看法更有說服力。"}}, {"qid": "q19", "level": 4, "level_name": "評估與評論", "sublevel": "4B", "stem": "文章第 1 段先從一次戲劇演出談起，這樣安排的作用是什麼？", "options": {"A": "交代作者看戲的時間與地點", "B": "說明京劇比其他戲劇好看", "C": "引出後文對劇中人物的討論", "D": "批評劇團演出時偷工減料"}, "answer": "C", "evidence_paragraph": [1, 2], "evidence_quote": "這齣戲固然是在寫藺相如……但我覺得還有別的意義", "hint": "看看第 2 段之後都在談什麼，再想第 1 段和後文有什麼關係。", "option_feedback": {"A": "第 1 段沒有寫明確的時間，演出只是談話的起點。", "B": "作者說自己最喜歡這齣戲，但沒有拿它和其他戲劇比較。", "D": "作者說「最精采的部分都演出來了」，並沒有批評。"}, "teacher": {"intent": "檢核學生能否評估開頭段落在全文結構中的作用，屬層次四 B。", "misconception": "被「省略」一詞誤導，以為作者在批評演出。", "teaching_point": "開頭的情境常用來引出話題，要看它和後文怎麼銜接。"}}, {"qid": "q20", "level": 4, "level_name": "評估與評論", "sublevel": "4B", "stem": "第 10 段在全文結構上的作用是什麼？", "options": {"A": "補充一件新的歷史事件", "B": "提出和前文相反的看法", "C": "轉而介紹另一齣京劇", "D": "收束前文並點出全文主旨"}, "answer": "D", "evidence_paragraph": [10], "evidence_quote": "藺相如的情緒有許多變化：出使前的心事重重……", "hint": "第 10 段把前面哪些段落的內容又提了一次？", "option_feedback": {"A": "第 10 段沒有新的事件，而是整理前面寫過的情緒變化。", "B": "第 10 段的看法和前文一致，是在總結。", "C": "第 10 段談的仍然是〈將相和〉。"}, "teacher": {"intent": "檢核學生能否評估結尾段在全文結構中的功能，屬層次四 B。", "misconception": "沒有發現第 10 段在重述前文，誤以為出現了新內容。", "teaching_point": "結尾段常用來總結前文、點出主旨，讀時可以對照前面各段。"}}], "remedial_pool": [{"qid": "r01", "level": 1, "level_name": "提取訊息", "sublevel": null, "stem": "趙王去澠池和秦王會面時，廉頗在做什麼？", "options": {"A": "守在邊境", "B": "陪趙王赴會", "C": "攻打齊國", "D": "出使秦國"}, "answer": "A", "evidence_paragraph": [3], "evidence_quote": "他守在邊境，讓秦國不敢輕舉妄動", "hint": "第 3 段寫了廉頗的「第二」件功勞，再讀一次。", "option_feedback": {"B": "陪趙王去澠池的不是廉頗，再看第 3 段。", "C": "攻打齊國是他的第一件功勞，不是這時候。", "D": "出使秦國的是藺相如。"}, "teacher": {"intent": "補強層次一：找出指定時間點人物在做的事。", "misconception": "把兩件功勞的順序弄混。", "teaching_point": "注意題目給的時間條件。"}, "for_level": 1}, {"qid": "r02", "level": 1, "level_name": "提取訊息", "sublevel": null, "stem": "一齣完整的〈將相和〉包括幾場戲？", "options": {"A": "兩場", "B": "三場", "C": "四場", "D": "五場"}, "answer": "B", "evidence_paragraph": [1], "evidence_quote": "要包括「完璧歸趙」「澠池之會」和「負荊請罪」", "hint": "回到第 1 段，數一數引號裡的戲名。", "option_feedback": {"A": "這次演出省略了一場所以只演兩場，但完整的戲不只兩場。", "C": "再數一次第 1 段列出的戲名。", "D": "再數一次第 1 段列出的戲名。"}, "teacher": {"intent": "補強層次一：找出明寫的數量。", "misconception": "把「這次演出」和「完整的戲」混在一起。", "teaching_point": "注意「完整」和「這次」的差別。"}, "for_level": 1}, {"qid": "r03", "level": 1, "level_name": "提取訊息", "sublevel": null, "stem": "第 9 段中，廉頗來請罪時背著什麼？", "options": {"A": "和氏璧", "B": "寶劍", "C": "荊條", "D": "書信"}, "answer": "C", "evidence_paragraph": [9], "evidence_quote": "廉頗背著荊條來請罪", "hint": "第 9 段後半有「背著」兩個字，往後讀。", "option_feedback": {"A": "和氏璧是藺相如帶去秦國的寶玉。", "B": "文中沒有提到寶劍。", "D": "文中沒有提到書信。"}, "teacher": {"intent": "補強層次一：找出明寫的物品。", "misconception": "憑印象選擇故事中出現過的物品。", "teaching_point": "回到原句確認，不靠印象。"}, "for_level": 1}, {"qid": "r04", "level": 2, "level_name": "推論分析", "sublevel": null, "stem": "根據第 4 段和第 9 段，藺相如一次次躲開廉頗，最可能是為了什麼？", "options": {"A": "他害怕廉頗的武力", "B": "他想讓趙王處罰廉頗", "C": "他不想再擔任高官", "D": "避免將相相爭傷害趙國"}, "answer": "D", "evidence_paragraph": [4, 9], "evidence_quote": "兩虎共鬥，其勢不俱生", "hint": "第 9 段他想到了一句話，想一想「兩虎共鬥」會帶來什麼結果。", "option_feedback": {"A": "第 9 段說他「不是不氣」，他躲開是有考量的，不是害怕。", "B": "文中沒有他向趙王告狀的情節。", "C": "文中沒有提到他想辭官。"}, "teacher": {"intent": "補強層次二：連結兩段推論人物動機。", "misconception": "把忍讓誤解為懦弱。", "teaching_point": "推論動機時要找人物自己想到的話。"}, "for_level": 2}, {"qid": "r05", "level": 2, "level_name": "推論分析", "sublevel": null, "stem": "根據第 6 段和第 8 段，藺相如回到館舍後長長吐氣，最能說明什麼？", "options": {"A": "剛才的鎮定其實承受很大壓力", "B": "他對秦王的款待感到滿意", "C": "他終於拿到了交換的城池", "D": "他走回館舍時累壞了"}, "answer": "A", "evidence_paragraph": [6, 8], "evidence_quote": "向來鎮定的他也不禁長長吐了一口氣", "hint": "對照第 6 段「賭一把」和第 8 段「心裡其實也在打鼓」。", "option_feedback": {"B": "文中沒有寫秦王款待他。", "C": "第 5 段說秦王沒有交換的誠意，他沒有拿到城池。", "D": "吐一口氣是心情放鬆，不是身體疲累。"}, "teacher": {"intent": "補強層次二：連結兩段推論人物心理。", "misconception": "只從字面理解「吐氣」。", "teaching_point": "動作描寫常常透露人物的心情。"}, "for_level": 2}, {"qid": "r06", "level": 2, "level_name": "推論分析", "sublevel": null, "stem": "根據第 3 段和第 4 段，廉頗驕傲的態度和什麼最有關係？", "options": {"A": "秦王對他的稱讚", "B": "他過去輝煌的戰功", "C": "部下對他的不滿", "D": "他和關羽的交情"}, "answer": "B", "evidence_paragraph": [3, 4], "evidence_quote": "他過去的成功使他驕傲", "hint": "第 3 段寫他的功勞，第 4 段說這些功勞讓他變成怎樣。", "option_feedback": {"A": "文中沒有寫秦王稱讚廉頗。", "C": "廉頗是對部下抱怨藺相如，不是部下不滿他。", "D": "關羽是後來三國時代的人，兩人沒有交情。"}, "teacher": {"intent": "補強層次二：連結兩段推論因果。", "misconception": "誤解關羽例子的作用。", "teaching_point": "因果關係常橫跨相鄰兩段。"}, "for_level": 2}, {"qid": "r07", "level": 3, "level_name": "詮釋整合", "sublevel": null, "stem": "最能概括第 5 段到第 8 段共同內容的是哪一項？", "options": {"A": "藺相如完璧歸趙時的處境與心情", "B": "廉頗與藺相如和好的過程", "C": "秦國與趙國的戰爭結果", "D": "劇團演出時遇到的困難"}, "answer": "A", "evidence_paragraph": [5, 6, 7, 8], "evidence_quote": "", "hint": "這四段的主角都是誰？發生在哪個事件裡？", "option_feedback": {"B": "和好的過程在第 9 段。", "C": "這幾段沒有寫戰爭的結果。", "D": "這幾段談的是劇中人物，不是劇團。"}, "teacher": {"intent": "補強層次三：概括連續段落。", "misconception": "只看單一段落的細節。", "teaching_point": "先找各段共同的人物與事件。"}, "for_level": 3}, {"qid": "r08", "level": 3, "level_name": "詮釋整合", "sublevel": null, "stem": "綜合全文，下列哪一項最能形容藺相如的整體形象？", "options": {"A": "衝動又好勝", "B": "有膽識也有氣度", "C": "口才好卻怕事", "D": "謹慎卻不敢冒險"}, "answer": "B", "evidence_paragraph": [6, 8, 9, 10], "evidence_quote": "面對強敵時的鎮定與膽識……忍讓和寬容", "hint": "把藺相如面對秦王和面對廉頗的表現合起來看。", "option_feedback": {"A": "他持璧睨柱是不得已，對廉頗也一再忍讓，並不好勝。", "C": "他面對秦王時表現出膽識，並不怕事。", "D": "他在必要時願意賭上性命，並不是不敢冒險。"}, "teacher": {"intent": "補強層次三：整合全文判斷人物整體特質。", "misconception": "只看單一事件下判斷。", "teaching_point": "人物特質要從多個事件一起看。"}, "for_level": 3}, {"qid": "r09", "level": 3, "level_name": "詮釋整合", "sublevel": null, "stem": "作者在全文中對廉頗的看法，最接近哪一項？", "options": {"A": "一無是處的小人物", "B": "比藺相如更值得學習", "C": "有大功卻一度被驕傲蒙蔽", "D": "不懂打仗只會說大話"}, "answer": "C", "evidence_paragraph": [3, 4, 9], "evidence_quote": "成功和榮耀反而會蒙住一個人的眼睛", "hint": "作者既寫了廉頗的功勞，也寫了他的缺點，兩邊都要看。", "option_feedback": {"A": "第 3 段說他是趙國最受依靠的將軍。", "B": "全文讚揚的是藺相如的品格。", "D": "他有攻城的大功，並不是只會說大話。"}, "teacher": {"intent": "補強層次三：整合全文判斷作者對人物的評價。", "misconception": "只看到缺點或只看到優點。", "teaching_point": "作者評價人物時常常同時寫優點與缺點。"}, "for_level": 3}, {"qid": "r10", "level": 4, "level_name": "評估與評論", "sublevel": "4A", "stem": "第 8 段用「心裡其實也在打鼓」形容藺相如，主要效果是什麼？", "options": {"A": "說明秦廷正在演奏音樂", "B": "生動寫出他內心的緊張", "C": "表現他對秦王的尊敬", "D": "交代他回館舍的時間"}, "answer": "B", "evidence_paragraph": [8], "evidence_quote": "他心裡其實也在打鼓", "hint": "心裡真的有鼓嗎？想一想作者用這個說法要表達什麼感覺。", "option_feedback": {"A": "這是比喻的說法，不是真的在打鼓。", "C": "他正在和秦王對峙，這句話寫的是他自己的心情。", "D": "這句話沒有時間的資訊。"}, "teacher": {"intent": "補強層次四 A：評估比喻的效果。", "misconception": "把比喻當成真實事件。", "teaching_point": "比喻能讓抽象的心情變得具體。"}, "for_level": 4}, {"qid": "r11", "level": 4, "level_name": "評估與評論", "sublevel": "4B", "stem": "作者先寫廉頗的兩件大功，再寫他的驕傲，這樣安排的作用是什麼？", "options": {"A": "說明驕傲是從成功而來", "B": "證明廉頗功勞比藺相如大", "C": "交代趙國打仗的先後順序", "D": "表示作者最欣賞的是廉頗"}, "answer": "A", "evidence_paragraph": [3, 4], "evidence_quote": "他過去的成功使他驕傲", "hint": "第 4 段開頭的「哪知」把前後兩段怎麼接起來？", "option_feedback": {"B": "文中沒有比較兩人的功勞大小。", "C": "兩件功勞只是例子，重點不在打仗的順序。", "D": "作者寫廉頗的功勞，是為了說明他後來的驕傲。"}, "teacher": {"intent": "補強層次四 B：評估段落安排的因果鋪陳。", "misconception": "把鋪陳的內容當成重點。", "teaching_point": "先寫成功再寫驕傲，是在鋪陳因果。"}, "for_level": 4}, {"qid": "r12", "level": 4, "level_name": "評估與評論", "sublevel": "4B", "stem": "第 7 段用「假如對手不是愛玉的秦王」作假設，作用是什麼？", "options": {"A": "預告秦王後來改變心意", "B": "說明這個計策不值得學", "C": "補充秦王殺人立威的歷史", "D": "強調成功靠的是看透對手"}, "answer": "D", "evidence_paragraph": [7], "evidence_quote": "假如對手……這招反而不會生效", "hint": "這個假設和第 7 段第一句「先看清了對手」有什麼關係？", "option_feedback": {"A": "假設的情況並沒有真的發生。", "B": "作者是在說明計策成功的條件，不是說它不好。", "C": "這是假設，不是歷史事實。"}, "teacher": {"intent": "補強層次四 B：評估假設在論述中的作用。", "misconception": "把假設當成事實。", "teaching_point": "作者用反面假設，來凸顯真正的關鍵。"}, "for_level": 4}], "reflection": {"prompt": "這一關我覺得最難的是哪一層？", "options": ["提取訊息", "推論分析", "詮釋整合", "評估與評論"], "sentence_prompt": "下次遇到主旨題，我要先……"}}, {"quest_id": "l01-q1", "text_id": "l01", "title": "誰最棒", "grade_band": "low", "genre": "記敘", "paragraph_count": 7, "settings": {"unlock_rule": "none", "hint_costs_points": false, "read_aloud": true, "zhuyin": true}, "warm_up": {"prompt": "看到題目〈誰最棒〉，你猜故事在說什麼？", "options": ["大家在說誰很棒", "小狗在找骨頭", "大家去動物園", "下雨天在家玩"], "scored": false}, "questions": [{"qid": "q01", "level": 1, "level_name": "提取訊息", "sublevel": null, "stem": "誰會彈鋼琴？", "options": {"A": "小安", "B": "小青", "C": "小美", "D": "小芬"}, "answer": "B", "evidence_paragraph": [2], "evidence_quote": "她會彈鋼琴", "hint": "再讀一次第 2 段，小安指著誰？", "option_feedback": {"A": "小安是說話的人，她說的是別人會彈鋼琴。", "C": "小美說的是小杰會說故事。", "D": "小芬是跳繩跳得最快的人。"}, "teacher": {"intent": "檢核學生能否找出句中「她」指的是誰，屬層次一。", "misconception": "把說話的人當成被稱讚的人。", "teaching_point": "「她」指的是前面被指著的人。"}}, {"qid": "q02", "level": 1, "level_name": "提取訊息", "sublevel": null, "stem": "阿明幫小雯撿起什麼？", "options": {"A": "帽子", "B": "書包", "C": "水壺", "D": "鉛筆"}, "answer": "A", "evidence_paragraph": [6], "evidence_quote": "幫小雯撿起被風吹走的帽子", "hint": "讀一讀第 6 段老師說的話。", "option_feedback": {"B": "第 6 段沒有說到書包。", "C": "第 6 段沒有說到水壺。", "D": "第 6 段沒有說到鉛筆。"}, "teacher": {"intent": "檢核學生能否找出明寫的物品，屬層次一。", "misconception": "憑想像作答。", "teaching_point": "答案要在文章裡找得到。"}}, {"qid": "q03", "level": 2, "level_name": "推論分析", "sublevel": null, "stem": "老師問完，有幾個小朋友回答？", "options": {"A": "三個", "B": "五個", "C": "四個", "D": "八個"}, "answer": "C", "evidence_paragraph": [2, 3, 4, 5], "evidence_quote": "小安、小美、小宇、阿明", "hint": "從第 2 段數到第 5 段，數一數是誰在說話。", "option_feedback": {"A": "再數一次，第 5 段的阿明也有說話喔。", "B": "被指著的小朋友沒有說話，只數說話的人。", "D": "被指著的人不算，只數說話的人。"}, "teacher": {"intent": "檢核學生能否跨段數出說話的人數，屬層次二。", "misconception": "把被指著的人也算進去。", "teaching_point": "數人數時，先想清楚要數的是哪一種人。"}}, {"qid": "q04", "level": 2, "level_name": "推論分析", "sublevel": null, "stem": "哪一件事最早發生？", "options": {"A": "阿明撿帽子", "B": "老師去小可家", "C": "大家午餐聊天", "D": "老師拍拍手"}, "answer": "B", "evidence_paragraph": [1, 6, 7], "evidence_quote": "老師前天去小可家拜訪", "hint": "找一找「前天」和「今天早上」這些表示時間的詞。", "option_feedback": {"A": "撿帽子是今天早上，還有更早的事。", "C": "午餐是今天中午，還有更早的事。", "D": "拍拍手是上課的時候，是很後面的事。"}, "teacher": {"intent": "檢核學生能否依時間詞排出事件先後，屬層次二。", "misconception": "照故事出現的順序作答。", "teaching_point": "故事說的順序不一定是事情發生的順序。"}}, {"qid": "q05", "level": 3, "level_name": "詮釋整合", "sublevel": null, "stem": "這篇文章最想告訴我們什麼？", "options": {"A": "會彈鋼琴才最棒", "B": "跳繩要跳得很快", "C": "吃完午餐要聊天", "D": "每個人都有棒的地方"}, "answer": "D", "evidence_paragraph": [6, 7], "evidence_quote": "大家都很棒", "hint": "老師最後對全班說了什麼？", "option_feedback": {"A": "小青會彈鋼琴很棒，可是其他人也很棒。", "B": "跳繩只是小芬很棒的地方。", "C": "聊天只是故事開始的時候。"}, "teacher": {"intent": "檢核學生能否說出全文最想告訴我們的話，屬層次三。", "misconception": "把一個人的優點當成全文重點。", "teaching_point": "故事最後的話常常是最想告訴我們的。"}}, {"qid": "q06", "level": 3, "level_name": "詮釋整合", "sublevel": null, "stem": "文中的老師是怎樣的老師？", "options": {"A": "會發現大家的優點", "B": "只誇獎會才藝的人", "C": "常常罵學生偷懶", "D": "不喜歡學生聊天"}, "answer": "A", "evidence_paragraph": [6, 7], "evidence_quote": "你很棒呀！", "hint": "看看老師對阿明和小可說了什麼。", "option_feedback": {"B": "阿明幫人撿帽子，老師也誇他很棒。", "C": "文中老師沒有罵人。", "D": "老師走過來和聊天的小朋友說話。"}, "teacher": {"intent": "檢核學生能否整合全文判斷人物特質，屬層次三。", "misconception": "沒有把老師的兩段話合起來看。", "teaching_point": "要看人物說的好幾句話，才知道他是怎樣的人。"}}, {"qid": "q07", "level": 4, "level_name": "評估與評論", "sublevel": "4A", "stem": "很多句子都像「她最棒，她會……」，這樣寫有什麼好處？", "options": {"A": "讓文章變得比較長", "B": "讓我們知道誰說謊", "C": "讀起來整齊又好比較", "D": "告訴我們誰最厲害"}, "answer": "C", "evidence_paragraph": [2, 3, 4], "evidence_quote": "她最棒，她會……", "hint": "把第 2、3、4 段放在一起讀，有沒有覺得很像？", "option_feedback": {"A": "句子很像，不是為了讓文章變長。", "B": "文中沒有人說謊。", "D": "故事最後說大家都很棒，沒有誰最厲害。"}, "teacher": {"intent": "檢核學生能否感受重複句型的效果，屬層次四 A。", "misconception": "以為重複只是湊字數。", "teaching_point": "一樣的句子排在一起，讀起來整齊，也方便比較。"}}, {"qid": "q08", "level": 4, "level_name": "評估與評論", "sublevel": "4B", "stem": "最後寫小可幫忙澆花，是想說明什麼？", "options": {"A": "老師只喜歡小可", "B": "沒說話的人也很棒", "C": "奶奶很喜歡種花", "D": "小可今天沒來上學"}, "answer": "B", "evidence_paragraph": [7], "evidence_quote": "小可每天都會幫忙澆花，也很棒！", "hint": "小可有在午餐時說話嗎？老師為什麼還要說到他？", "option_feedback": {"A": "老師說「大家都很棒」，不是只喜歡小可。", "C": "澆花的是小可，重點在小可。", "D": "文中沒有說小可今天有沒有來。"}, "teacher": {"intent": "檢核學生能否理解結尾安排的作用，屬層次四 B。", "misconception": "把細節當重點。", "teaching_point": "故事最後加上一個人，是要讓大家知道每個人都很棒。"}}], "remedial_pool": [], "reflection": {"prompt": "這一關你覺得怎麼樣？", "options": ["很簡單", "剛剛好", "有點難"]}}, {"quest_id": "m03-q1", "text_id": "m03", "title": "圈叉棋達人", "grade_band": "middle", "genre": "圖表推理", "paragraph_count": 5, "settings": {"unlock_rule": "levels_1_2_then_open", "hint_costs_points": false, "read_aloud": false, "zhuyin": false}, "warm_up": {"prompt": "看到標題〈圈叉棋達人〉，你猜文章主要會寫什麼？", "options": ["一個很會下棋的人", "一間賣棋子的商店", "一場運動會的比賽", "一本教畫畫的書"], "scored": false}, "questions": [{"qid": "q01", "level": 1, "level_name": "提取訊息", "sublevel": null, "stem": "在安親班裡，年紀最小的是誰？", "options": {"A": "小宇", "B": "品萱", "C": "庭瑄", "D": "美琪"}, "answer": "A", "evidence_paragraph": [1], "evidence_quote": "在安親班裡，小宇年紀最小", "hint": "回到第 1 段，找一找「年紀最小」這幾個字。", "option_feedback": {"B": "品萱是和小宇比賽的人，文中沒有說她年紀最小。", "C": "庭瑄在最後一段才出現，文中沒有說她的年紀。", "D": "美琪是第一回的對手，再找找第 1 段。"}, "teacher": {"intent": "檢核學生能否找出明寫的人物資訊，屬層次一。", "misconception": "被人名多的表格干擾。", "teaching_point": "先找關鍵詞，再看它前後的人名。"}}, {"qid": "q02", "level": 1, "level_name": "提取訊息", "sublevel": null, "stem": "根據紀錄冊，第三回小宇的對手是誰？", "options": {"A": "美琪", "B": "志豪", "C": "佳欣", "D": "俊傑"}, "answer": "C", "evidence_paragraph": [1], "evidence_quote": "第三回｜佳欣", "hint": "在紀錄冊裡找到「第三回」那一列，往右看。", "option_feedback": {"A": "美琪是第一回的對手。", "B": "志豪是第二回的對手。", "D": "俊傑是第四回的對手。"}, "teacher": {"intent": "檢核學生能否從表格中找到指定欄位的資訊，屬層次一。", "misconception": "看錯列。", "teaching_point": "讀表格時，用手指對齊同一列。"}}, {"qid": "q03", "level": 1, "level_name": "提取訊息", "sublevel": null, "stem": "根據紀錄冊的說明，誰可以先畫？", "options": {"A": "年紀比較小的人", "B": "猜拳贏的人", "C": "上一回贏的人", "D": "老師指定的人"}, "answer": "B", "evidence_paragraph": [1], "evidence_quote": "誰猜拳贏就先畫", "hint": "看看紀錄冊標題旁邊的括號。", "option_feedback": {"A": "小宇年紀最小，但他不是每一回都先畫。", "C": "表格裡沒有這樣的規則，看看標題的括號。", "D": "文中沒有老師指定的規則。"}, "teacher": {"intent": "檢核學生能否讀出表格標題中的規則說明，屬層次一。", "misconception": "忽略表格標題的補充說明。", "teaching_point": "表格的標題和括號常常寫著重要規則。"}}, {"qid": "q04", "level": 2, "level_name": "推論分析", "sublevel": null, "stem": "小宇先畫的那幾回，比賽結果都怎麼樣？", "options": {"A": "都是平手", "B": "都是小宇勝", "C": "有勝也有平手", "D": "有一回小宇輸"}, "answer": "B", "evidence_paragraph": [1], "evidence_quote": "第二、四、五回小宇先畫，結果都是小宇勝", "hint": "先找出「先畫的人」是小宇的那幾列，再看它們的結果。", "option_feedback": {"A": "平手的那兩回，先畫的都不是小宇。", "C": "再對一次：小宇先畫的那幾回，有沒有平手？", "D": "五回裡小宇沒有輸過任何一回。"}, "teacher": {"intent": "檢核學生能否合併表格兩欄找出規律，屬層次二。", "misconception": "只看結果欄，沒有對照先畫的人。", "teaching_point": "合併兩欄資訊時，先篩選再比較。"}}, {"qid": "q05", "level": 2, "level_name": "推論分析", "sublevel": null, "stem": "五回比賽中，哪一位對手最快就輸了？", "options": {"A": "志豪", "B": "品萱", "C": "美琪", "D": "俊傑"}, "answer": "D", "evidence_paragraph": [1], "evidence_quote": "第四回｜俊傑｜5 步｜小宇勝", "hint": "先找出小宇贏的回合，再比一比「一共畫了幾步」。", "option_feedback": {"A": "志豪那一回一共畫了 7 步，還有更少的。", "B": "品萱那一回一共畫了 7 步，還有更少的。", "C": "美琪那一回是平手，她沒有輸。"}, "teacher": {"intent": "檢核學生能否合併「步數」與「結果」兩欄推論，屬層次二。", "misconception": "只看步數，沒有確認是否輸了。", "teaching_point": "比較時要同時符合兩個條件。"}}, {"qid": "q06", "level": 2, "level_name": "推論分析", "sublevel": null, "stem": "根據紀錄冊和志明老師的話，下列哪一項說法最合理？", "options": {"A": "小宇每一回都是先畫", "B": "平手的回合都是小宇先畫", "C": "先畫的人在這五回都沒輸", "D": "小宇贏的回合都畫了九步"}, "answer": "C", "evidence_paragraph": [1, 3], "evidence_quote": "通常先畫的比較有利", "hint": "志明老師說先畫比較有利，回到表格檢查每一回先畫的人有沒有輸。", "option_feedback": {"A": "第一回和第三回是對手先畫。", "B": "平手的兩回是美琪和佳欣先畫。", "D": "畫九步的兩回都是平手。"}, "teacher": {"intent": "檢核學生能否結合文字與表格驗證說法，屬層次二。", "misconception": "只記得老師的話，沒有回表格驗證。", "teaching_point": "文字說法要回到表格逐列檢查。"}}, {"qid": "q07", "level": 3, "level_name": "詮釋整合", "sublevel": null, "stem": "綜合全文，小宇被叫作「〇✕達人」的理由是什麼？", "options": {"A": "常找人挑戰又很專注投入", "B": "他是安親班年紀最大的", "C": "他每一回都是先畫的人", "D": "他打敗過所有的老師"}, "answer": "A", "evidence_paragraph": [1, 3], "evidence_quote": "一有空檔就找人挑戰……太投入、太專注了", "hint": "把第 1 段寫小宇的事，和第 3 段老師對他的評語合起來看。", "option_feedback": {"B": "第 1 段說小宇年紀最小。", "C": "表格裡有兩回是對手先畫。", "D": "老師只說輸給小宇好幾次，沒有說所有老師。"}, "teacher": {"intent": "檢核學生能否整合全文資訊說明人物特質，屬層次三。", "misconception": "誤讀年紀資訊，或過度推論老師的話。", "teaching_point": "說明理由時要整合不同段落的線索。"}}, {"qid": "q08", "level": 3, "level_name": "詮釋整合", "sublevel": null, "stem": "這篇文章主要在說什麼？", "options": {"A": "志明老師教大家下圈叉棋", "B": "品萱想發明新的棋子符號", "C": "猜拳的運氣決定一切輸贏", "D": "小宇愛下圈叉棋又很用心"}, "answer": "D", "evidence_paragraph": [1, 2, 3, 4, 5], "evidence_quote": "", "hint": "全文從頭到尾，誰出現最多次？文章圍繞著他的哪件事？", "option_feedback": {"A": "志明老師只說了一段話就離開了，沒有教大家。", "B": "這是品萱問的一個問題，只是結尾的細節。", "C": "老師說運氣重要，但也   // ------------------------------------------------------------ markdown (subset used by texts.json)
  function inline(s) {

          return l.trim().replace(/^\||\|$/g, "").split("|").map(function (c) { return c.trim(); });
        });
        var t = '<div class="tbl"><table><thead><tr>' + rows[0].map(function (c) { return "<th>" + inline(c) + "</th>"; }).join("") + "</tr></thead><tbody>";
        rows.slice(1).forEach(function (r) { t += "<tr>" + r.map(function (c) { return "<td>" + inline(c) + "</td>"; }).join("") + "</tr>"; });
        html.push(t + "</tbody></table></div>");
        return;
      }
      if (lines.every(function (l) { return /^\s*-\s/.test(l); })) {
        html.push("<ul>" + lines.map(function (l) { return "<li>" + inline(l.replace(/^\s*-\s/, "")) + "</li>"; }).join("") + "</ul>");
        return;
      }
      var first = b.trim().charAt(0), n = circledNum(first);
      if (n) {
        var body = b.trim().slice(1).trim();
        var isOrig = section === "" || section === "原文";
        var attr = isOrig ? ' data-p="' + n + '"' : "";
        var say = opts.readAloud ? '<button class="say" data-action="say-para" aria-label="朗讀第 ' + n + ' 段">▶ 朗讀</button>' : "";

      }
      html.push('<p class="note">' + inline(b).replace(/\n/g, "<br>") + "</p>");

  // ------------------------------------------------------------ speech + zhuyin

  var pinyinReady = null;

  }
  var INITIALS = { b: "ㄅ", p: "ㄆ", m: "ㄇ", f: "ㄈ", d: "ㄉ", t: "ㄊ", n: "ㄋ", l: "ㄌ", g: "ㄍ", k: "ㄎ", h: "ㄏ", j: "ㄐ", q: "ㄑ", x: "ㄒ", zh: "ㄓ", ch: "ㄔ", sh: "ㄕ", r: "ㄖ", z: "ㄗ", c: "ㄘ", s: "ㄙ" };
  var FINALS = { a: "ㄚ", o: "ㄛ", e: "ㄜ", "ê": "ㄝ", ai: "ㄞ", ei: "ㄟ", ao: "ㄠ", ou: "ㄡ", an: "ㄢ", en: "ㄣ", ang: "ㄤ", eng: "ㄥ", er: "ㄦ", ong: "ㄨㄥ",
    i: "ㄧ", ia: "ㄧㄚ", ie: "ㄧㄝ", iao: "ㄧㄠ", iu: "ㄧㄡ", ian: "ㄧㄢ", "in": "ㄧㄣ", iang: "ㄧㄤ", ing: "ㄧㄥ", iong: "ㄩㄥ",
    u: "ㄨ", ua: "ㄨㄚ", uo: "ㄨㄛ", uai: "ㄨㄞ", ui: "ㄨㄟ", uan: "ㄨㄢ", un: "ㄨㄣ", uang: "ㄨㄤ",
    "ü": "ㄩ", "üe": "ㄩㄝ", "üan": "ㄩㄢ", "ün": "ㄩㄣ" };
  var TONES = { 1: "", 2: "ˊ", 3: "ˇ", 4: "ˋ" };
  function toZhuyin(py) {

      yu: "ü", yue: "üe", yuan: "üan", yun: "ün", wu: "u", wa: "ua", wo: "uo", wai: "uai", wei: "ui", wan: "uan", wen: "un", wang: "uang", weng: "ueng" };
    if (yw[s]) { fin = yw[s]; }
    else {

      if (im) { ini = im[1]; fin = im[2]; }

      if (/^(zh|ch|sh|r|z|c|s)$/.test(ini) && fin === "i") fin = "";
    }

    else if (rec.picks.length >= 3) { rec.done = true; rec.correct = false; rec.first = false; rec.revealed = true; }

  // ------------------------------------------------------------ journey

    });

  function historyDetail(quest, s) {

    var w = quest.warm_up, warm = w && r.warm !== null && r.warm !== undefined ? "<p class=\"small\">讀前預測：「" + esc(w.options[r.warm]) + "」" + (r.warmCheck !== null && r.warmCheck !== undefined ? "，讀完自評：" + ["猜對了", "猜對一部分", "沒猜到"][r.warmCheck] : "") + "</p>" : "";

  function advanceAfterLevel(quest, p) {

  var actions = {

    warm: function (el) { var p = curProgress(); p.warm = +el.dataset.i; save(); afterAnswerUpdate(); },

      else if (p.step === "retry") { p.retry.mainRec = p.answers[q.qid]; recordPick(p.retry, q, k, quest, "retry"); delete p.retry.mainRec; }
      var ctx = p.step === "remedial" ? p.remedial : p.step === "retry" ? p.retry : p;
      var rec = ctx.answers[q.qid];

    jump: function (el) {

    },
    "next-q": function () {
      var quest = curQuest(), p = curProgress();
      if (p.step === "levels") {

        for (var i = p.cur + 1; i < qs.length; i++) { var r = p.answers[qs[i].qid]; if (!r || !r.done) { nextOpen = i; break; } }
        if (nextOpen < 0) for (i = 0; i < qs.length; i++) { r = p.answers[qs[i].qid]; if (!r || !r.done) { nextOpen = i; break; } }
        if (nextOpen >= 0) p.cur = nextOpen;
        else {
          var st = levelStats(quest, p, p.level), pass = !levelNeedsGate(quest, p.level) || st.first >= threshold(st.n);
          var prev = p.levelResult[p.level] || {};

        if (o >= 0) p.retry.cur = o; else { p.step = "done"; save(); return render(); }
      }

    },
    "level-next": function () { var quest = curQuest(), p = curProgress(); advanceAfterLevel(quest, p); save(); render(); window.scrollTo(0, 0); },
    "start-remedial": function () {

    "toggle-zhuyin": function () { view.zhuyin = !view.zhuyin; render(); },
    say: function (el) { speak(el.dataset.text); },
    "say-para": function (el) { speak(el.closest(".para").textContent.replace("▶ 朗讀", "")); },
    "say-all": function () {
      var art = $("#article"); if (!art) return;
      var c = art.cloneNode(true); c.querySelectorAll("rt, .say").forEach(function (x) { x.remove(); });
      speak(c.textContent);
    },
    "join-retry": function () { online.joinError = ""; online.joinClass = null; render(); },
    "submit-quest": function (el) { submitQuest(el.dataset.id); },
    "pick-class": function (el) { view.cls = el.dataset.code; view.openSub = null; render(); if (!online.subs[view.cls]) loadSubs(view.cls); window.scrollTo(0, 0); },
    "load-classes": function () { loadClasses(); },
    "load-subs": function () { if (view.cls) loadSubs(view.cls); },
    "open-sub": function (el) { view.openSub = view.openSub === el.dataset.key ? null : el.dataset.key; render(); },
    "qr-big": function () { view.qrBig = true; render(); },
    "qr-close": function () { view.qrBig = false; render(); },
    "dash-online": function () { view.dashSource = view.cls; view.teacherTab = "dash"; render(); window.scrollTo(0, 0); },
    "copy-link": function () {
      var box = $("#joinLinkBox"), txt = box.textContent;
      var sel = function () { var r = document.createRange(); r.selectNodeContents(box); var s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("已選取，請按 Ctrl+C 複製"); };
      try { navigator.clipboard.writeText(txt).then(function () { toast("已複製網址"); }, sel); } catch (e) { sel(); }
    },
    tteab: function (el) { view.teacherTab = el.dataset.tab; render(); },
    "do-import": doImport,
    "remove-import": function (el) { store.imported.quests = store.imported.quests.filter(function (q) { return q.quest_id !== el.dataset.id; }); save(); rebuildData(); render(); },
    "demo-class": loadDemoClass,
    "clear-demo": function () { Object.keys(store.profiles).forEach(function (id) { if (store.profiles[id].demo) delete store.profiles[id]; }); if (store.current && !store.profiles[store.current]) store.current = null; save(); render(); },
    "copy-export": function () {
      var txt = $("#exportBox").textContent;
      var sel = function () { var r = document.createRange(); r.selectNodeContents($("#exportBox")); var s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("已選取，請按 Ctrl+C 複製"); };
      try { navigator.clipboard.writeText(txt).then(function () { toast("已複製"); }, sel); } catch (e) { sel(); }
    }
  };
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-action]");
    if (el && el.tagName !== "SELECT" && !el.disabled && actions[el.dataset.action]) { e.preventDefault(); actions[el.dataset.action](el); return; }
    // eraser: click a pen mark while pen mode is on
    var m = e.target.closest("mark.pen");
    if (m && view.pen) { var parent = m.parentNode; while (m.firstChild) parent.insertBefore(m.firstChild, m); parent.removeChild(m); parent.normalize(); savePen(); }
  });
  document.addEventListener("change", function (e) {
    if (e.target.id === "tqSel") { view.teacherQuest = e.target.value; render(); }
    if (e.target.id === "dashSrc") { view.dashSource = e.target.value; render(); }
  });
  document.addEventListener("input", function (e) {
    if (e.target.id === "reflSentence") { var p = curProgress(); p.reflection.sentence = e.target.value; save(); }
  });
  // pen: wrap selection inside the article
  document.addEventListener("mouseup", penSelect);
  document.addEventListener("touchend", function () { setTimeout(penSelect, 30); });
  function penSelect() {
    if (!view.pen) return;
    var art = $("#article"), sel = window.getSelection();
    if (!art || !sel || sel.isCollapsed || !sel.rangeCount) return;
    var range = sel.getRangeAt(0);
    if (!art.contains(range.commonAncestorContainer)) return;
    var block = function (n) { return (n.nodeType === 1 ? n : n.parentNode).closest(".para, .note, td, li"); };
    if (block(range.startContainer) !== block(range.endContainer) || !block(range.startContainer)) { toast("畫線請在同一段裡選取"); sel.removeAllRanges(); return; }
    var mark = document.createElement("mark"); mark.className = "pen";
    try { mark.appendChild(range.extractContents()); range.insertNode(mark); } catch (e) { /* ignore */ }
    sel.removeAllRanges(); savePen();
  }
  function savePen() {
    if (view.name !== "quest") return;
    var art = $("#article"), p = curProgress(); if (!art) return;
    var c = art.cloneNode(true); c.querySelectorAll(".evidence").forEach(function (x) { x.classList.remove("evidence"); });
    p.penHTML = c.innerHTML; save();
  }

  readLaunchParams();
  render();
})();
</script>
